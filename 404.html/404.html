<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Solution — الصفحة غير موجودة</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f5f0; color: #111; }
    main { max-width: 560px; padding: 48px 28px; text-align: center; }
    .brand { font-size: 28px; font-weight: 700; letter-spacing: -1px; margin-bottom: 64px; }
    .brand::first-letter { color: #f65a67; }
    h1 { font-size: clamp(34px, 7vw, 64px); margin: 0 0 18px; }
    p { color: #666; font-size: 18px; line-height: 1.8; margin: 0 0 30px; }
    a { display: inline-block; border: 1px solid #111; border-radius: 999px; color: #111; padding: 14px 24px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">A<span>solution</span></div>
    <h1>الصفحة غير موجودة</h1>
    <p>يبدو أن الرابط غير صحيح أو أن الصفحة لم تعد متاحة.</p>
    <a href="/ar/">العودة إلى الموقع</a>
  </main>
</body>
</html>
