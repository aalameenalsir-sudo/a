<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>A Solution — CUSTOMER PORTAL</title>
<link rel="stylesheet" href="store.css"><link rel="stylesheet" href="premium-store.css">
<style>
.portal-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 38px}
.portal-tabs button{border:1px solid var(--ink);background:transparent;padding:12px 18px;cursor:pointer}
.portal-tabs button.active{background:var(--ink);color:#fff}
.portal-panel{display:none}.portal-panel.active{display:block}
.portal-list{display:grid;gap:12px}
.portal-card{border:1px solid var(--line);padding:18px}
.portal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body class="premium-store utility-premium">
<header class="top premium-top">
<a class="logo" href="index.html">A <i></i> SOLUTION <span>STORE</span></a>
<nav><a href="index.html">STORE</a><button class="pill" id="logout">SIGN OUT</button></nav>
</header>
<main class="section premium-page-head">
<div class="section-head"><div><span class="section-no">A SOLUTION / CLIENT</span><h2 class="mask-reveal">CUSTOMER<br>PORTAL.</h2></div><p>Orders, downloads, active services and saved addresses — all in one place.</p></div>
<div id="portal-status" aria-live="polite"></div>
<div class="portal-tabs">
<button data-tab="orders" class="active">ORDERS</button>
<button data-tab="downloads">DOWNLOADS</button>
<button data-tab="services">SERVICES</button>
<button data-tab="addresses">ADDRESSES</button>
</div>
<section id="panel-orders" class="portal-panel active"><div id="orders" class="portal-list"></div></section>
<section id="panel-downloads" class="portal-panel"><div id="downloads" class="portal-list"></div></section>
<section id="panel-services" class="portal-panel"><div id="services" class="portal-list"></div></section>
<section id="panel-addresses" class="portal-panel">
<form id="address-form" class="form-grid">
<label class="field"><span>Label</span><input name="label" placeholder="Office"></label>
<label class="field"><span>City</span><input name="city" required></label>
<label class="field full"><span>Address</span><input name="address_line" required></label>
<button class="primary" type="submit">ADD ADDRESS →</button>
</form>
<div id="addresses" class="portal-list"></div>
</section>
</main>
<script src="store-config.js"></script><script src="store-core.js"></script><script src="remote.js"></script><script src="account.js"></script><script src="store-motion.js"></script>
</body></html>
