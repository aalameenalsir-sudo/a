<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Projects — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ Add</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Project</th><th>Client</th><th>Owner</th><th>Status</th><th>Budget</th><th>Cost</th><th>End</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Client Projects</h2><button class="btn" type="button" onclick="Admin.closeModal()">✕</button></div><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field "><label>Project name</label><input type="text" name="name" required ></div><div class="field "><label>Client</label><select name="client_id" id="clientSelect"></select></div><div class="field "><label>Owner employee</label><select name="owner_id" id="ownerSelect"></select></div><div class="field "><label>Status</label><select name="status" id="status"><option value="planned">Planned</option><option value="active">Active</option><option value="in_progress">In progress</option><option value="on_hold">On hold</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div class="field "><label>Start date</label><input type="date" name="start_date"  ></div><div class="field "><label>End date</label><input type="date" name="end_date"  ></div><div class="field "><label>Budget</label><input type="number" name="budget"  step="0.01" min="0"></div><div class="field "><label>Actual cost</label><input type="number" name="actual_cost"  step="0.01" min="0"></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let dataRows=[];let editId=null;let clientMap={},employeeMap={};async function initSelects(){let [c,e]=await Promise.all([Admin.loadSelect('#clientSelect','clients',{label:'name',placeholder:'Select client'}),Admin.loadSelect('#ownerSelect','employees',{label:'name',placeholder:'Select owner'})]);clientMap=Object.fromEntries(c.map(x=>[x.id,x.name]));employeeMap=Object.fromEntries(e.map(x=>[x.id,x.name]));}
function newItem(){editId=null;form.reset();form.id.value='';document.getElementById('modalTitle').textContent='Add Client Projects';Admin.openModal();}
function editItem(id){const r=dataRows.find(x=>x.id===id);if(!r)return;editId=id;form.reset();for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=v??'';document.getElementById('modalTitle').textContent='Edit Client Projects';Admin.openModal();}
async function removeItem(id){if(!confirm('Delete this record?'))return;const {error}=await supabaseClient.from('client_projects').delete().eq('id',id);if(error)return Admin.toast(error.message);await Admin.log('delete','client_projects',id);Admin.toast('Deleted');load();}
function render(){let list=[...dataRows];rows.innerHTML=list.length?list.map(r=>`<tr><td>${Admin.esc(r.name??"—")}</td><td>${Admin.esc(clientMap[r.client_id]||"—")}</td><td>${Admin.esc(employeeMap[r.owner_id]||"—")}</td><td>${Admin.badge(r.status)}</td><td>${Admin.money(r.budget)}</td><td>${Admin.money(r.actual_cost)}</td><td>${Admin.date(r.end_date)}</td><td><div class="actions"><button class="btn small" onclick="editItem(${r.id})">Edit</button><button class="btn small danger" onclick="removeItem(${r.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="8" class="empty">No records yet.</td></tr>';}
async function load(){let q=supabaseClient.from('client_projects').select('*').order('created_at',{ascending:false});const {data,error}=await q;if(error)return Admin.toast(error.message);dataRows=data||[];render();}
form.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));delete o.id;o.client_id=Admin.id(o.client_id);o.owner_id=Admin.id(o.owner_id);o.budget=Admin.number(o.budget);o.actual_cost=Admin.number(o.actual_cost);Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=editId?await supabaseClient.from('client_projects').update(o).eq('id',editId).select().single():await supabaseClient.from('client_projects').insert(o).select().single();if(res.error)return Admin.toast(res.error.message);await Admin.log(editId?'update':'create','client_projects',res.data?.id||editId);Admin.closeModal();Admin.toast('Saved');load();});
(async()=>{Admin.shell('Client Projects','Internal delivery projects with budget, cost and ownership.');if(await Admin.requireAdmin()){await Promise.all([load(),,initSelects()]);}})();
</script></body></html>
