<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Manager — A Solution</title><link rel="stylesheet" href="admin-common.css"><style>.preview-frame{width:100%;height:720px;border:1px solid #dfe2e8;border-radius:18px;background:#fff}.color-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.color-row input[type=color]{height:48px;padding:4px}.json-help{font-size:12px;color:#777}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:900px){.split,.color-row{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><a class="btn" href="../index.html" target="_blank">Open Website ↗</a><button class="btn primary" onclick="saveAll()">Save & Publish</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div>
<section class="section"><div class="section-head"><div><h2>Hero & Brand</h2><div class="sub">Control the first impression without editing code.</div></div></div><div class="form-grid"><div class="field full"><label>Hero kicker</label><input id="hero_kicker"></div><div class="field full"><label>Hero title</label><input id="hero_title"></div><div class="field full"><label>Hero description</label><textarea id="hero_description"></textarea></div><div class="field"><label>Primary CTA label</label><input id="primary_cta_label"></div><div class="field"><label>Primary CTA link</label><input id="primary_cta_link"></div><div class="field"><label>Secondary CTA label</label><input id="secondary_cta_label"></div><div class="field"><label>Secondary CTA link</label><input id="secondary_cta_link"></div><div class="field full"><label>Hero media URL (optional)</label><input id="hero_media_url" placeholder="https://..."></div></div></section>
<section class="section"><div class="section-head"><h2>Theme</h2></div><div class="color-row"><div class="field"><label>Accent</label><input id="accent_color" type="color"></div><div class="field"><label>Background</label><input id="background_color" type="color"></div><div class="field"><label>Surface</label><input id="surface_color" type="color"></div><div class="field"><label>Text</label><input id="text_color" type="color"></div></div><div class="form-grid" style="margin-top:16px"><div class="field"><label>Motion intensity</label><select id="motion_intensity"><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div><div class="field"><label>Visible sections</label><div class="actions" style="justify-content:flex-start"><label><input id="show_services" type="checkbox"> Services</label><label><input id="show_projects" type="checkbox"> Projects</label><label><input id="show_about" type="checkbox"> About</label><label><input id="show_contact" type="checkbox"> Contact</label></div></div></div></section>
<section class="section"><div class="section-head"><h2>About & Content</h2></div><div class="form-grid"><div class="field full"><label>About title</label><input id="about_title"></div><div class="field full"><label>About text</label><textarea id="about_text"></textarea></div><div class="field full"><label>Services JSON</label><textarea id="services" rows="9"></textarea><div class="json-help">Each item: {"title":"...","text":"..."}</div></div><div class="field full"><label>Metrics JSON</label><textarea id="metrics" rows="7"></textarea><div class="json-help">Each item: {"value":"500+","label":"Active screens"}</div></div></div></section>
<section class="section"><div class="section-head"><div><h2>Live Preview</h2><div class="sub">Published content appears here after Save & Publish.</div></div><button class="btn" onclick="refreshPreview()">Refresh preview</button></div><iframe class="preview-frame" id="preview" src="../index.html?preview=1"></iframe></section>
</main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
const fields=['hero_kicker','hero_title','hero_description','primary_cta_label','primary_cta_link','secondary_cta_label','secondary_cta_link','about_title','about_text','hero_media_url','accent_color','background_color','surface_color','text_color','motion_intensity'];
async function load(){const {data,error}=await supabaseClient.from('website_settings').select('*').eq('id',1).single();if(error)return Admin.toast(error.message);fields.forEach(k=>{const el=document.getElementById(k);if(el)el.value=data[k]??''});services.value=JSON.stringify(data.services||[],null,2);metrics.value=JSON.stringify(data.metrics||[],null,2);['show_services','show_projects','show_about','show_contact'].forEach(k=>document.getElementById(k).checked=data[k]!==false)}
async function saveAll(){let parsedServices,parsedMetrics;try{parsedServices=JSON.parse(services.value);parsedMetrics=JSON.parse(metrics.value)}catch{Admin.toast('Services or metrics JSON is invalid');return}const o={id:1,services:parsedServices,metrics:parsedMetrics};fields.forEach(k=>o[k]=document.getElementById(k).value||null);['show_services','show_projects','show_about','show_contact'].forEach(k=>o[k]=document.getElementById(k).checked);const {error}=await supabaseClient.from('website_settings').upsert(o);if(error)return Admin.toast(error.message);await Admin.log('publish','website_settings',1);Admin.toast('Website published');refreshPreview()}
function refreshPreview(){preview.src='../index.html?preview='+Date.now()}
(async()=>{Admin.shell('Website Manager','Change public content, theme and sections without editing code.');if(await Admin.requireAdmin())await load()})();
</script></body></html>
