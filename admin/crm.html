<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Activities — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ Add activity</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="filters"><select id="clientFilter"><option value="">All clients</option></select><select id="typeFilter"><option value="">All activity types</option><option>note</option><option>call</option><option>email</option><option>meeting</option><option>follow_up</option></select></div><section class="section"><div class="timeline" id="timeline"></div></section><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">CRM Activity</h2><button class="btn" type="button" onclick="Admin.closeModal()">✕</button></div><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field "><label>Client</label><select name="client_id" id="clientSelect"></select></div><div class="field "><label>Activity type</label><select name="activity_type" id="activity_type"><option value="note">Note</option><option value="call">Call</option><option value="email">Email</option><option value="meeting">Meeting</option><option value="follow_up">Follow up</option></select></div><div class="field "><label>Subject</label><input type="text" name="subject"  ></div><div class="field "><label>Activity date/time</label><input type="datetime-local" name="activity_date"  ></div><div class="field "><label>Next action</label><input type="date" name="next_action_date"  ></div><div class="field full"><label>Details</label><textarea name="details"></textarea></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let all=[],clients={},editId=null,user=null;async function init(){const c=await Admin.loadSelect('#clientSelect','clients',{label:'name',placeholder:'Select client'});clients=Object.fromEntries(c.map(x=>[x.id,x.name]));clientFilter.innerHTML='<option value="">All clients</option>'+c.map(x=>`<option value="${x.id}">${Admin.esc(x.name)}</option>`).join('');const q=Admin.q('client');if(q)clientFilter.value=q;}
function newItem(){editId=null;form.reset();form.activity_date.value=new Date().toISOString().slice(0,16);if(clientFilter.value)form.client_id.value=clientFilter.value;Admin.openModal()}
function editItem(id){const r=all.find(x=>x.id===id);if(!r)return;editId=id;for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=k==='activity_date'&&v?new Date(v).toISOString().slice(0,16):(v??'');Admin.openModal()}
async function removeItem(id){if(!confirm('Delete this activity?'))return;const {error}=await supabaseClient.from('crm_activities').delete().eq('id',id);if(error)return Admin.toast(error.message);Admin.toast('Deleted');load()}
function render(){let list=[...all];if(clientFilter.value)list=list.filter(x=>String(x.client_id)===clientFilter.value);if(typeFilter.value)list=list.filter(x=>x.activity_type===typeFilter.value);timeline.innerHTML=list.length?list.map(r=>`<div class="timeline-item"><div class="list-item"><div class="row"><div><b>${Admin.esc(r.subject||r.activity_type)}</b><div class="sub">${Admin.esc(clients[r.client_id]||'No client')} · ${Admin.datetime(r.activity_date)} · ${Admin.badge(r.activity_type)}</div></div><div class="actions"><button class="btn small" onclick="editItem(${r.id})">Edit</button><button class="btn small danger" onclick="removeItem(${r.id})">Delete</button></div></div><p>${Admin.esc(r.details||'')}</p>${r.next_action_date?`<div class="sub">Next action: ${Admin.date(r.next_action_date)}</div>`:''}</div></div>`).join(''):'<div class="empty">No CRM activities.</div>'}
async function load(){const {data,error}=await supabaseClient.from('crm_activities').select('*').order('activity_date',{ascending:false});if(error)return Admin.toast(error.message);all=data||[];render()}
form.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));delete o.id;o.client_id=Admin.id(o.client_id);o.created_by=user.id;o.activity_date=o.activity_date?new Date(o.activity_date).toISOString():new Date().toISOString();Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=editId?await supabaseClient.from('crm_activities').update(o).eq('id',editId):await supabaseClient.from('crm_activities').insert(o);if(res.error)return Admin.toast(res.error.message);Admin.closeModal();Admin.toast('Saved');load()});clientFilter.addEventListener('change',render);typeFilter.addEventListener('change',render);(async()=>{Admin.shell('CRM Activities','Calls, meetings, notes and next actions in one timeline.');user=await Admin.requireAdmin();if(user){await init();await load()}})();
</script></body></html>
