<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Activities — A Solution</title>
<link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main">
<div class="topbar"><div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ Add</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div>
<div class="section"><div class="table-wrap"><table><thead><tr><th>Client Id</th><th>Activity Type</th><th>Subject</th><th>Activity Date</th><th>Next Action Date</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div>
<div class="modal-backdrop" id="modal"><div class="modal"><h2 id="modalTitle">Add</h2><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field"><label>Client ID</label><input name="client_id" type="number" step="0.01"></div>
<div class="field"><label>Type</label><select name="activity_type"><option value="note">Note</option><option value="call">Call</option><option value="email">Email</option><option value="meeting">Meeting</option><option value="follow_up">Follow Up</option></select></div>
<div class="field"><label>Subject</label><input name="subject" type="text"></div>
<div class="field full"><label>Details</label><textarea name="details"></textarea></div>
<div class="field"><label>Activity date</label><input name="activity_date" type="date"></div>
<div class="field"><label>Next action</label><input name="next_action_date" type="date"></div></div><div class="actions" style="margin-top:16px"><button class="btn primary">Save</button><button type="button" class="btn" onclick="Admin.closeModal()">Cancel</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
const TABLE="crm_activities", COLS=["client_id", "activity_type", "subject", "activity_date", "next_action_date"], NUMERIC=["client_id"]; let cache=[];
function display(v,c){if(v==null||v==='')return '—'; if(['estimated_value','budget','actual_cost','value','amount','spent'].includes(c))return Admin.money(v); return Admin.esc(v)}
async function load(){const {data,error}=await supabaseClient.from(TABLE).select('*').order('created_at',{ascending:false});if(error){Admin.toast(error.message);return}cache=data||[];rows.innerHTML=cache.length?cache.map(r=>`<tr>${COLS.map(c=>`<td>${display(r[c],c)}</td>`).join('')}<td><button class="btn small" onclick="editItem(${r.id})">Edit</button> <button class="btn small danger" onclick="delItem(${r.id})">Delete</button></td></tr>`).join(''):`<tr><td class="empty" colspan="$6">No records yet.</td></tr>`}
function newItem(){form.reset();form.id.value='';modalTitle.textContent='Add CRM Activities';Admin.openModal()}
function editItem(id){const r=cache.find(x=>x.id===id);if(!r)return;form.reset();for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=v??'';modalTitle.textContent='Edit CRM Activities';Admin.openModal()}
async function delItem(id){if(!confirm('Delete this record?'))return;const {error}=await supabaseClient.from(TABLE).delete().eq('id',id);if(error)return Admin.toast(error.message);Admin.toast('Deleted');load()}
form.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(form),id=fd.get('id');let obj={};for(const [k,v] of fd.entries()){if(k==='id')continue;if(v==='')obj[k]=null;else obj[k]=NUMERIC.includes(k)?Number(v):v}
if(TABLE==='crm_activities'&&!id){const {data:{session}}=await supabaseClient.auth.getSession();obj.created_by=session.user.id}
let q=id?supabaseClient.from(TABLE).update(obj).eq('id',id):supabaseClient.from(TABLE).insert(obj);const {error}=await q;if(error)return Admin.toast(error.message);Admin.closeModal();Admin.toast('Saved');load()});
(async()=>{Admin.shell("CRM Activities","Calls, meetings, notes and follow-ups");if(await Admin.requireAdmin())load()})();
</script></body></html>
