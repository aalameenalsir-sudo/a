<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contracts — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ Add</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Title</th><th>Client</th><th>Status</th><th>Value</th><th>Start</th><th>End</th><th>File</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Contracts</h2><button class="btn" type="button" onclick="Admin.closeModal()">✕</button></div><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field "><label>Contract title</label><input type="text" name="title" required ></div><div class="field "><label>Client</label><select name="client_id" id="clientSelect"></select></div><div class="field "><label>Public project</label><select name="project_id" id="projectSelect"></select></div><div class="field "><label>Status</label><select name="status" id="status"><option value="draft">Draft</option><option value="active">Active</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div class="field "><label>Start date</label><input type="date" name="start_date"  ></div><div class="field "><label>End date</label><input type="date" name="end_date"  ></div><div class="field "><label>Contract value</label><input type="number" name="value"  step="0.01" min="0"></div><div class="field "><label>Contract file URL</label><input type="url" name="file_url"  ></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let dataRows=[];let editId=null;let clientMap={},projectMap={};async function initSelects(){let [c,p]=await Promise.all([Admin.loadSelect('#clientSelect','clients',{label:'name',placeholder:'Select client'}),Admin.loadSelect('#projectSelect','projects',{label:'title',placeholder:'Select public project'})]);clientMap=Object.fromEntries(c.map(x=>[x.id,x.name]));projectMap=Object.fromEntries(p.map(x=>[x.id,x.title]));}
function newItem(){editId=null;form.reset();form.id.value='';document.getElementById('modalTitle').textContent='Add Contracts';Admin.openModal();}
function editItem(id){const r=dataRows.find(x=>x.id===id);if(!r)return;editId=id;form.reset();for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=v??'';document.getElementById('modalTitle').textContent='Edit Contracts';Admin.openModal();}
async function removeItem(id){if(!confirm('Delete this record?'))return;const {error}=await supabaseClient.from('contracts').delete().eq('id',id);if(error)return Admin.toast(error.message);await Admin.log('delete','contracts',id);Admin.toast('Deleted');load();}
function render(){let list=[...dataRows];rows.innerHTML=list.length?list.map(r=>`<tr><td>${Admin.esc(r.title??"—")}</td><td>${Admin.esc(clientMap[r.client_id]||"—")}</td><td>${Admin.badge(r.status)}</td><td>${Admin.money(r.value)}</td><td>${Admin.date(r.start_date)}</td><td>${Admin.date(r.end_date)}</td><td>${Admin.safeUrl(r.file_url)?`<a class="link" target="_blank" rel="noopener" href="${Admin.esc(Admin.safeUrl(r.file_url))}">Open</a>`:"—"}</td><td><div class="actions"><button class="btn small" onclick="editItem(${r.id})">Edit</button><button class="btn small danger" onclick="removeItem(${r.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="8" class="empty">No records yet.</td></tr>';}
async function load(){let q=supabaseClient.from('contracts').select('*').order('created_at',{ascending:false});const {data,error}=await q;if(error)return Admin.toast(error.message);dataRows=data||[];render();}
form.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));delete o.id;o.client_id=Admin.id(o.client_id);o.project_id=Admin.id(o.project_id);o.value=Admin.number(o.value);if(o.file_url&&!Admin.safeUrl(o.file_url))return Admin.toast('File URL must start with http or https');Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=editId?await supabaseClient.from('contracts').update(o).eq('id',editId).select().single():await supabaseClient.from('contracts').insert(o).select().single();if(res.error)return Admin.toast(res.error.message);await Admin.log(editId?'update':'create','contracts',res.data?.id||editId);Admin.closeModal();Admin.toast('Saved');load();});
(async()=>{Admin.shell('Contracts','Commercial agreements linked to clients and projects.');if(await Admin.requireAdmin()){await Promise.all([load(),,initSelects()]);}})();
</script></body></html>
