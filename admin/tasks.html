<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ Add</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="filters"><select id="statusFilter"><option value="">All statuses</option><option>todo</option><option>in_progress</option><option>blocked</option><option>completed</option></select><select id="priorityFilter"><option value="">All priorities</option><option>low</option><option>medium</option><option>high</option><option>urgent</option></select></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Task</th><th>Assignee</th><th>Client</th><th>Status</th><th>Priority</th><th>Due</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Tasks</h2><button class="btn" type="button" onclick="Admin.closeModal()">✕</button></div><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field "><label>Task title</label><input type="text" name="title" required ></div><div class="field "><label>Assigned employee</label><select name="assigned_to" id="employeeSelect"></select></div><div class="field "><label>Client</label><select name="client_id" id="clientSelect"></select></div><div class="field "><label>Public project</label><select name="project_id" id="projectSelect"></select></div><div class="field "><label>Status</label><select name="status" id="status"><option value="todo">To do</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="completed">Completed</option></select></div><div class="field "><label>Priority</label><select name="priority" id="priority"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select></div><div class="field "><label>Due date</label><input type="date" name="due_date"  ></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let dataRows=[];let editId=null;let clientMap={},employeeMap={},projectMap={};async function initSelects(){let [c,e,p]=await Promise.all([Admin.loadSelect('#clientSelect','clients',{label:'name',placeholder:'Select client'}),Admin.loadSelect('#employeeSelect','employees',{label:'name',placeholder:'Select assignee'}),Admin.loadSelect('#projectSelect','projects',{label:'title',placeholder:'Select public project'})]);clientMap=Object.fromEntries(c.map(x=>[x.id,x.name]));employeeMap=Object.fromEntries(e.map(x=>[x.id,x.name]));projectMap=Object.fromEntries(p.map(x=>[x.id,x.title]));}
function newItem(){editId=null;form.reset();form.id.value='';document.getElementById('modalTitle').textContent='Add Tasks';Admin.openModal();}
function editItem(id){const r=dataRows.find(x=>x.id===id);if(!r)return;editId=id;form.reset();for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=v??'';document.getElementById('modalTitle').textContent='Edit Tasks';Admin.openModal();}
async function removeItem(id){if(!confirm('Delete this record?'))return;const {error}=await supabaseClient.from('tasks').delete().eq('id',id);if(error)return Admin.toast(error.message);await Admin.log('delete','tasks',id);Admin.toast('Deleted');load();}
function render(){let list=[...dataRows];if(statusFilter.value)list=list.filter(x=>x.status===statusFilter.value);if(priorityFilter.value)list=list.filter(x=>x.priority===priorityFilter.value);rows.innerHTML=list.length?list.map(r=>`<tr><td>${Admin.esc(r.title??"—")}</td><td>${Admin.esc(employeeMap[r.assigned_to]||"—")}</td><td>${Admin.esc(clientMap[r.client_id]||"—")}</td><td>${Admin.badge(r.status)}</td><td>${Admin.badge(r.priority)}</td><td>${Admin.date(r.due_date)}</td><td><div class="actions"><button class="btn small" onclick="editItem(${r.id})">Edit</button><button class="btn small danger" onclick="removeItem(${r.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No records yet.</td></tr>';}
async function load(){let q=supabaseClient.from('tasks').select('*').order('created_at',{ascending:false});const {data,error}=await q;if(error)return Admin.toast(error.message);dataRows=data||[];render();}
form.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));delete o.id;o.assigned_to=Admin.id(o.assigned_to);o.client_id=Admin.id(o.client_id);o.project_id=Admin.id(o.project_id);Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=editId?await supabaseClient.from('tasks').update(o).eq('id',editId).select().single():await supabaseClient.from('tasks').insert(o).select().single();if(res.error)return Admin.toast(res.error.message);await Admin.log(editId?'update':'create','tasks',res.data?.id||editId);Admin.closeModal();Admin.toast('Saved');load();});
(async()=>{Admin.shell('Tasks','Deadlines, priorities and assignments.');if(await Admin.requireAdmin()){await Promise.all([load(),,initSelects()]);}})();
statusFilter.addEventListener('change',render);priorityFilter.addEventListener('change',render);</script></body></html>
