<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clients — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ Add</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="filters"><input id="search" placeholder="Search client or company"><select id="statusFilter"><option value="">All statuses</option><option>lead</option><option>prospect</option><option>active</option><option>inactive</option><option>won</option><option>lost</option></select></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Status</th><th>Follow-up</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Clients</h2><button class="btn" type="button" onclick="Admin.closeModal()">✕</button></div><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field "><label>Name</label><input type="text" name="name" required ></div><div class="field "><label>Company</label><input type="text" name="company"  ></div><div class="field "><label>Email</label><input type="email" name="email"  ></div><div class="field "><label>Phone</label><input type="text" name="phone"  ></div><div class="field "><label>Status</label><select name="status" id="status"><option value="lead">Lead</option><option value="prospect">Prospect</option><option value="active">Active</option><option value="inactive">Inactive</option><option value="won">Won</option><option value="lost">Lost</option></select></div><div class="field "><label>Next follow-up</label><input type="date" name="next_follow_up"  ></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let dataRows=[];let editId=null;
function newItem(){editId=null;form.reset();form.id.value='';document.getElementById('modalTitle').textContent='Add Clients';Admin.openModal();}
function editItem(id){const r=dataRows.find(x=>x.id===id);if(!r)return;editId=id;form.reset();for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=v??'';document.getElementById('modalTitle').textContent='Edit Clients';Admin.openModal();}
async function removeItem(id){if(!confirm('Delete this record?'))return;const {error}=await supabaseClient.from('clients').delete().eq('id',id);if(error)return Admin.toast(error.message);await Admin.log('delete','clients',id);Admin.toast('Deleted');load();}
function render(){let list=[...dataRows];const s=search.value.toLowerCase();list=list.filter(r=>(!s||`${r.name||''} ${r.company||''} ${r.email||''}`.toLowerCase().includes(s))&&(!statusFilter.value||r.status===statusFilter.value));rows.innerHTML=list.length?list.map(r=>`<tr><td>${Admin.esc(r.name??"—")}</td><td>${Admin.esc(r.company??"—")}</td><td>${Admin.esc(r.email??"—")}</td><td>${Admin.badge(r.status)}</td><td>${Admin.date(r.next_follow_up)}</td><td><div class="actions"><a class="btn small" href="crm.html?client=${r.id}">Timeline</a><button class="btn small" onclick="editItem(${r.id})">Edit</button><button class="btn small danger" onclick="removeItem(${r.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No records yet.</td></tr>';}
async function load(){let q=supabaseClient.from('clients').select('*').order('created_at',{ascending:false});const {data,error}=await q;if(error)return Admin.toast(error.message);dataRows=data||[];render();}
form.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));delete o.id;Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=editId?await supabaseClient.from('clients').update(o).eq('id',editId).select().single():await supabaseClient.from('clients').insert(o).select().single();if(res.error)return Admin.toast(res.error.message);await Admin.log(editId?'update':'create','clients',res.data?.id||editId);Admin.closeModal();Admin.toast('Saved');load();});
(async()=>{Admin.shell('Clients','CRM contacts, status, notes and follow-ups.');if(await Admin.requireAdmin()){await load();}})();
search.addEventListener('input',render);statusFilter.addEventListener('change',render);</script></body></html>
