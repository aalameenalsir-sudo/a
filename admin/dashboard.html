<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div><button class="btn" onclick="Admin.logout()">Logout</button></div><div class="grid" id="metrics"></div><div class="section"><div class="section-head"><h2>Quick access</h2></div><div class="grid"><a class="card" href="opportunities.html"><b>Sales Pipeline</b><p class="sub">Track leads and deals</p></a><a class="card" href="tasks.html"><b>Tasks</b><p class="sub">Deadlines and assignments</p></a><a class="card" href="campaigns.html"><b>Campaigns</b><p class="sub">Budget, spend and leads</p></a><a class="card" href="reports.html"><b>Reports</b><p class="sub">Finance and performance</p></a></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
async function count(t,q='*'){let {count}=await supabaseClient.from(t).select(q,{count:'exact',head:true});return count||0}async function load(){let [clients,opp,tasks,msg]=await Promise.all([count('clients'),count('opportunities'),count('tasks'),count('messages')]);metrics.innerHTML=[['Clients',clients],['Opportunities',opp],['Tasks',tasks],['Messages',msg]].map(x=>`<div class="card metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}(async()=>{Admin.shell('Dashboard','A Solution business control center');if(await Admin.requireAdmin())load()})();</script></body></html>
