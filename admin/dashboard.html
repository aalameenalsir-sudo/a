<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="grid" id="metrics"></div><div class="split"><section class="section"><div class="section-head"><h2>Business pulse</h2><a class="link" href="reports.html">Full reports →</a></div><div id="pulse" class="list"></div></section><section class="section"><div class="section-head"><h2>Upcoming</h2><a class="link" href="tasks.html">Tasks →</a></div><div id="upcoming" class="list"></div></section></div><section class="section"><div class="section-head"><h2>Quick access</h2></div><div class="grid"><a class="card quick" href="opportunities.html"><b>Sales Pipeline</b><p class="sub">Move leads through the deal stages.</p></a><a class="card quick" href="quotations.html"><b>Quotations</b><p class="sub">Create itemized offers with VAT.</p></a><a class="card quick" href="invoices.html"><b>Invoices</b><p class="sub">Track billing, payments and balance.</p></a><a class="card quick" href="campaigns.html"><b>Campaigns</b><p class="sub">Budget, spend, leads and CPL.</p></a></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
async function load(){const today=new Date().toISOString().slice(0,10);const [clients,opps,tasks,projects,invoices,payments,expenses,notes,msgs]=await Promise.all([
 supabaseClient.from('clients').select('id',{count:'exact'}),supabaseClient.from('opportunities').select('id,stage,estimated_value'),supabaseClient.from('tasks').select('id,title,status,due_date').order('due_date',{ascending:true,nullsFirst:false}),supabaseClient.from('client_projects').select('id,status'),supabaseClient.from('invoices').select('id,total,paid_amount,status,due_date'),supabaseClient.from('payments').select('amount'),supabaseClient.from('expenses').select('amount'),supabaseClient.from('notifications').select('id,title,created_at,read_at').is('read_at',null),supabaseClient.from('messages').select('id,status')]);
 const inv=invoices.data||[], task=tasks.data||[], opp=opps.data||[];const outstanding=inv.reduce((s,x)=>s+Math.max(0,Admin.number(x.total)-Admin.number(x.paid_amount)),0);const overdue=task.filter(x=>x.due_date&&x.due_date<today&&!['completed','done'].includes(x.status)).length;const active=(projects.data||[]).filter(x=>['active','in_progress'].includes(x.status)).length;const unread=(notes.data||[]).length;const cards=[['Clients',clients.count||0,'CRM records'],['Pipeline',Admin.money(opp.filter(x=>!['won','lost'].includes(x.stage)).reduce((s,x)=>s+Admin.number(x.estimated_value),0)),'Open opportunity value'],['Outstanding',Admin.money(outstanding),'Invoice receivables'],['Overdue Tasks',overdue,'Needs attention'],['Active Projects',active,'Client delivery'],['Unread Notifications',unread,'System alerts'],['Payments',Admin.money((payments.data||[]).reduce((s,x)=>s+Admin.number(x.amount),0)),'Cash received'],['Expenses',Admin.money((expenses.data||[]).reduce((s,x)=>s+Admin.number(x.amount),0)),'Recorded costs']];metrics.innerHTML=cards.map(c=>`<div class="card metric"><div class="label">${c[0]}</div><div class="value">${c[1]}</div><div class="hint">${c[2]}</div></div>`).join('');
 pulse.innerHTML=[`<div class="list-item"><div class="row"><b>Won sales</b><b>${Admin.money(opp.filter(x=>x.stage==='won').reduce((s,x)=>s+Admin.number(x.estimated_value),0))}</b></div></div>`,`<div class="list-item"><div class="row"><b>New messages</b><b>${(msgs.data||[]).filter(x=>x.status==='new').length}</b></div></div>`,`<div class="list-item"><div class="row"><b>Open opportunities</b><b>${opp.filter(x=>!['won','lost'].includes(x.stage)).length}</b></div></div>`].join('');
 const due=task.filter(x=>x.due_date&&!['completed','done'].includes(x.status)).slice(0,5);upcoming.innerHTML=due.length?due.map(x=>`<div class="list-item"><b>${Admin.esc(x.title)}</b><div class="sub">${Admin.date(x.due_date)} · ${Admin.badge(x.status)}</div></div>`).join(''):'<div class="empty">No upcoming tasks.</div>';
}
(async()=>{Admin.shell('Dashboard','A Solution business control center');if(await Admin.requireAdmin())await load()})();
</script></body></html>
