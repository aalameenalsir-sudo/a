<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoices — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ New invoice</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="grid" id="summary"></div><div class="filters"><select id="clientFilter"><option value="">All clients</option></select><select id="statusFilter"><option value="">All statuses</option><option>draft</option><option>sent</option><option>partial</option><option>paid</option><option>overdue</option><option>cancelled</option></select></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Number</th><th>Client</th><th>Status</th><th>Total</th><th>Paid</th><th>Balance</th><th>Due</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Invoice</h2><button class="btn" type="button" onclick="Admin.closeModal()">✕</button></div><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field "><label>Client</label><select name="client_id" id="clientSelect"></select></div><div class="field "><label>Client project</label><select name="project_id" id="projectSelect"></select></div><div class="field "><label>Quotation</label><select name="quotation_id" id="quotationSelect"></select></div><div class="field "><label>Status</label><select name="status" id="status"><option value="draft">Draft</option><option value="sent">Sent</option><option value="partial">Partial</option><option value="paid">Paid</option><option value="overdue">Overdue</option><option value="cancelled">Cancelled</option></select></div><div class="field "><label>Issue date</label><input type="date" name="issue_date"  ></div><div class="field "><label>Due date</label><input type="date" name="due_date"  ></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let all=[],clientMap={},editId=null;async function init(){const [c,p,q]=await Promise.all([Admin.loadSelect('#clientSelect','clients',{label:'name',placeholder:'Select client'}),Admin.loadSelect('#projectSelect','client_projects',{label:'name',placeholder:'Select client project'}),Admin.loadSelect('#quotationSelect','quotations',{label:'quote_number',placeholder:'Select quotation'})]);clientMap=Object.fromEntries(c.map(x=>[x.id,x.name]));clientFilter.innerHTML='<option value="">All clients</option>'+c.map(x=>`<option value="${x.id}">${Admin.esc(x.name)}</option>`).join('')}
function newItem(){editId=null;form.reset();form.issue_date.value=new Date().toISOString().slice(0,10);Admin.openModal()}function editItem(id){const r=all.find(x=>x.id===id);editId=id;for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=v??'';Admin.openModal()}
async function removeItem(id){if(!confirm('Delete invoice and its items?'))return;const {error}=await supabaseClient.from('invoices').delete().eq('id',id);if(error)return Admin.toast(error.message);load()}
function render(){let list=[...all];if(clientFilter.value)list=list.filter(x=>String(x.client_id)===clientFilter.value);if(statusFilter.value)list=list.filter(x=>x.status===statusFilter.value);rows.innerHTML=list.length?list.map(r=>`<tr><td><b>${Admin.esc(r.invoice_number)}</b></td><td>${Admin.esc(clientMap[r.client_id]||'—')}</td><td>${Admin.badge(r.status)}</td><td>${Admin.money(r.total)}</td><td>${Admin.money(r.paid_amount)}</td><td>${Admin.money(Admin.number(r.total)-Admin.number(r.paid_amount))}</td><td>${Admin.date(r.due_date)}</td><td><div class="actions"><a class="btn small primary" href="invoice-edit.html?id=${r.id}">Open</a><button class="btn small" onclick="editItem(${r.id})">Edit</button><button class="btn small danger" onclick="removeItem(${r.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="8" class="empty">No invoices yet.</td></tr>';const total=all.reduce((s,x)=>s+Admin.number(x.total),0),paid=all.reduce((s,x)=>s+Admin.number(x.paid_amount),0);summary.innerHTML=[['Invoiced',Admin.money(total)],['Received',Admin.money(paid)],['Outstanding',Admin.money(total-paid)],['Invoices',all.length]].map(x=>`<div class="card metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}
async function load(){const {data,error}=await supabaseClient.from('invoices').select('*').order('created_at',{ascending:false});if(error)return Admin.toast(error.message);all=data||[];render()}
form.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));delete o.id;o.client_id=Admin.id(o.client_id);o.project_id=Admin.id(o.project_id);o.quotation_id=Admin.id(o.quotation_id);if(!editId)o.invoice_number=Admin.generateNumber('INV');Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=editId?await supabaseClient.from('invoices').update(o).eq('id',editId).select().single():await supabaseClient.from('invoices').insert(o).select().single();if(res.error)return Admin.toast(res.error.message);Admin.closeModal();if(!editId&&res.data?.id)location.href=`invoice-edit.html?id=${res.data.id}`;else load()});clientFilter.addEventListener('change',render);statusFilter.addEventListener('change',render);(async()=>{Admin.shell('Invoices','Billing, VAT, payment status and outstanding balances.');if(await Admin.requireAdmin()){await init();await load()}})();
</script></body></html>
