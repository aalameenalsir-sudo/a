<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoices</title><link rel="stylesheet" href="admin-common.css"></head><body>
<div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div><div class="actions"><button class="btn primary" onclick="Admin.openModal()">+ New</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div>
<div class="table-wrap"><table><thead><tr><th>Number</th><th>Client ID</th><th>Status</th><th>Subtotal</th><th>Tax</th><th>Total</th><th>Paid</th><th>Balance</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main></div>
<div class="modal-backdrop" id="modal"><div class="modal"><h2>New Invoice</h2><form id="form"><div class="form-grid"><div class="field"><label>Client ID</label><input name="client_id" type="number"></div><div class="field"><label>Title / Notes</label><input name="title" type="text"></div><div class="field"><label>Status</label><select name="status"><option>draft</option><option>sent</option><option>accepted</option><option>paid</option><option>cancelled</option></select></div><div class="field"><label>Due date</label><input name="due_date" type="date"></div><div class="field"><label>Tax rate</label><input name="tax_rate" type="number" value="15"></div></div><div class="actions" style="margin-top:15px"><button class="btn primary">Create</button><button type="button" class="btn" onclick="Admin.closeModal()">Cancel</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
const TABLE='invoices', NUM='invoice_number';let cache=[];function makeNum(){let d=new Date(),p=n=>String(n).padStart(2,'0');return 'INV-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}
async function load(){const {data,error}=await supabaseClient.from(TABLE).select('*').order('created_at',{ascending:false});if(error)return Admin.toast(error.message);cache=data||[];rows.innerHTML=cache.length?cache.map(r=>`<tr><td>${Admin.esc(r[NUM])}</td><td>${r.client_id??'—'}</td><td><span class="badge">${Admin.esc(r.status)}</span></td><td>${Admin.money(r.subtotal)}</td><td>${Admin.money(r.tax_amount)}</td><td><b>${Admin.money(r.total)}</b></td>${`<td>${Admin.money(r.paid_amount)}</td><td>${Admin.money(Number(r.total||0)-Number(r.paid_amount||0))}</td>`}<td><button class="btn small danger" onclick="del(${r.id})">Delete</button></td></tr>`).join(''):'<tr><td class="empty" colspan="9">No records yet.</td></tr>'}
async function del(id){if(!confirm('Delete?'))return;let {error}=await supabaseClient.from(TABLE).delete().eq('id',id);if(error)return Admin.toast(error.message);load()}
form.addEventListener('submit',async e=>{e.preventDefault();let fd=new FormData(form),o={[NUM]:makeNum(),client_id:Number(fd.get('client_id')),status:fd.get('status'),tax_rate:Number(fd.get('tax_rate')||15)};o.notes=fd.get("title")||null;o.due_date=fd.get("due_date")||null;let {error}=await supabaseClient.from(TABLE).insert(o);if(error)return Admin.toast(error.message);Admin.closeModal();form.reset();load()});
(async()=>{Admin.shell('Invoices','Sales and finance control');if(await Admin.requireAdmin())load()})();</script></body></html>
