<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Editor — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="print-sheet"><section class="section"><div class="section-head"><div><h2 id="invoiceNo">Invoice</h2><div class="sub" id="invoiceMeta"></div></div><div class="actions no-print"><button class="btn" onclick="window.print()">Print</button><a class="btn" href="invoices.html">Back</a></div></div><div class="form-grid no-print"><div class="field"><label>Client</label><select id="clientSelect"><option value="">Select client</option></select></div><div class="field"><label>Client project</label><select id="projectSelect"><option value="">Select project</option></select></div><div class="field"><label>Status</label><select id="status"><option>draft</option><option>sent</option><option>partial</option><option>paid</option><option>overdue</option><option>cancelled</option></select></div><div class="field"><label>Issue date</label><input id="issueDate" type="date"></div><div class="field"><label>Due date</label><input id="dueDate" type="date"></div><div class="field full"><label>Notes</label><textarea id="notes"></textarea></div></div><div class="form-actions no-print"><button class="btn primary" onclick="saveHeader()">Save invoice details</button></div></section><section class="section"><div class="section-head"><h2>Invoice items</h2><button class="btn primary no-print" onclick="newLine()">+ Add item</button></div><div class="table-wrap"><table><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Line total</th><th class="no-print">Actions</th></tr></thead><tbody id="itemRows"></tbody></table></div><div class="totals"><div class="statline"><span>Subtotal</span><b id="subtotal"></b></div><div class="statline"><span>VAT <span id="taxRate"></span>%</span><b id="taxAmount"></b></div><div class="statline"><span>Total</span><b id="total"></b></div><div class="statline"><span>Paid</span><b id="paid"></b></div><div class="statline"><span>Balance</span><b id="balance"></b></div></div></section></div><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2>Invoice item</h2><button class="btn" onclick="Admin.closeModal()">✕</button></div><form id="itemForm"><div class="form-grid"><div class="field full"><label>Description</label><input name="description" required></div><div class="field"><label>Quantity</label><input name="quantity" type="number" step="0.01" min="0" value="1" required></div><div class="field"><label>Unit price</label><input name="unit_price" type="number" step="0.01" min="0" value="0" required></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save item</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
const invoiceId=Admin.id(Admin.q('id'));let invoice=null,items=[],editLine=null,clientMap={};async function initSelects(){const [c,p]=await Promise.all([Admin.loadSelect('#clientSelect','clients',{label:'name',placeholder:'Select client'}),Admin.loadSelect('#projectSelect','client_projects',{label:'name',placeholder:'Select project'})]);clientMap=Object.fromEntries(c.map(x=>[x.id,x.name]))}
async function load(){if(!invoiceId)return Admin.toast('Missing invoice id');const [{data:i,error},{data:lines,error:le}]=await Promise.all([supabaseClient.from('invoices').select('*').eq('id',invoiceId).single(),supabaseClient.from('invoice_items').select('*').eq('invoice_id',invoiceId).order('id')]);if(error||le)return Admin.toast((error||le).message);invoice=i;items=lines||[];clientSelect.value=i.client_id||'';projectSelect.value=i.project_id||'';status.value=i.status;issueDate.value=i.issue_date||'';dueDate.value=i.due_date||'';notes.value=i.notes||'';invoiceNo.textContent=i.invoice_number||'Invoice';invoiceMeta.textContent=`${clientMap[i.client_id]||'No client'} · ${Admin.date(i.issue_date)}`;subtotal.textContent=Admin.money(i.subtotal);taxRate.textContent=i.tax_rate;taxAmount.textContent=Admin.money(i.tax_amount);total.textContent=Admin.money(i.total);paid.textContent=Admin.money(i.paid_amount);balance.textContent=Admin.money(Admin.number(i.total)-Admin.number(i.paid_amount));itemRows.innerHTML=items.length?items.map(x=>`<tr><td>${Admin.esc(x.description)}</td><td>${Admin.esc(x.quantity)}</td><td>${Admin.money(x.unit_price)}</td><td>${Admin.money(x.line_total)}</td><td class="no-print"><div class="actions"><button class="btn small" onclick="editItem(${x.id})">Edit</button><button class="btn small danger" onclick="removeItem(${x.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Add your first invoice item.</td></tr>'}
async function saveHeader(){const o={client_id:Admin.id(clientSelect.value),project_id:Admin.id(projectSelect.value),status:status.value,issue_date:issueDate.value,due_date:dueDate.value||null,notes:notes.value||null};const {error}=await supabaseClient.from('invoices').update(o).eq('id',invoiceId);if(error)return Admin.toast(error.message);Admin.toast('Invoice saved');load()}
function newLine(){editLine=null;itemForm.reset();itemForm.quantity.value=1;itemForm.unit_price.value=0;Admin.openModal()}function editItem(id){const x=items.find(i=>i.id===id);editLine=id;itemForm.description.value=x.description;itemForm.quantity.value=x.quantity;itemForm.unit_price.value=x.unit_price;Admin.openModal()}async function removeItem(id){if(!confirm('Delete item?'))return;const {error}=await supabaseClient.from('invoice_items').delete().eq('id',id);if(error)return Admin.toast(error.message);load()}
itemForm.addEventListener('submit',async e=>{e.preventDefault();const o={invoice_id:invoiceId,description:itemForm.description.value.trim(),quantity:Admin.number(itemForm.quantity.value),unit_price:Admin.number(itemForm.unit_price.value)};const res=editLine?await supabaseClient.from('invoice_items').update(o).eq('id',editLine):await supabaseClient.from('invoice_items').insert(o);if(res.error)return Admin.toast(res.error.message);Admin.closeModal();await load()});(async()=>{Admin.shell('Invoice Editor','Invoice items and totals are authoritative from Supabase triggers.');if(await Admin.requireAdmin()){await initSelects();await load()}})();
</script></body></html>
