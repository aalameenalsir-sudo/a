<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaigns — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ Add</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="grid" id="summary"></div><div class="filters"><input id="platformFilter" placeholder="Filter platform"><select id="statusFilter"><option value="">All statuses</option><option>planned</option><option>active</option><option>paused</option><option>completed</option><option>cancelled</option></select></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Campaign</th><th>Client</th><th>Platform</th><th>Status</th><th>Budget</th><th>Spent</th><th>Leads</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Campaigns</h2><button class="btn" type="button" onclick="Admin.closeModal()">✕</button></div><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field "><label>Campaign name</label><input type="text" name="name" required ></div><div class="field "><label>Client</label><select name="client_id" id="clientSelect"></select></div><div class="field "><label>Platform</label><input type="text" name="platform"  ></div><div class="field "><label>Objective</label><input type="text" name="objective"  ></div><div class="field "><label>Status</label><select name="status" id="status"><option value="planned">Planned</option><option value="active">Active</option><option value="paused">Paused</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div class="field "><label>Start date</label><input type="date" name="start_date"  ></div><div class="field "><label>End date</label><input type="date" name="end_date"  ></div><div class="field "><label>Budget</label><input type="number" name="budget"  step="0.01" min="0"></div><div class="field "><label>Spent</label><input type="number" name="spent"  step="0.01" min="0"></div><div class="field "><label>Leads</label><input type="number" name="leads_count"  min="0"></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let dataRows=[];let editId=null;let clientMap={};async function initSelects(){let c=await Admin.loadSelect('#clientSelect','clients',{label:'name',placeholder:'Select client'});clientMap=Object.fromEntries(c.map(x=>[x.id,x.name]));}
function newItem(){editId=null;form.reset();form.id.value='';document.getElementById('modalTitle').textContent='Add Campaigns';Admin.openModal();}
function editItem(id){const r=dataRows.find(x=>x.id===id);if(!r)return;editId=id;form.reset();for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=v??'';document.getElementById('modalTitle').textContent='Edit Campaigns';Admin.openModal();}
async function removeItem(id){if(!confirm('Delete this record?'))return;const {error}=await supabaseClient.from('campaigns').delete().eq('id',id);if(error)return Admin.toast(error.message);await Admin.log('delete','campaigns',id);Admin.toast('Deleted');load();}
function render(){let list=[...dataRows];if(platformFilter.value)list=list.filter(x=>(x.platform||'').toLowerCase().includes(platformFilter.value.toLowerCase()));if(statusFilter.value)list=list.filter(x=>x.status===statusFilter.value);rows.innerHTML=list.length?list.map(r=>`<tr><td>${Admin.esc(r.name??"—")}</td><td>${Admin.esc(clientMap[r.client_id]||"—")}</td><td>${Admin.esc(r.platform??"—")}</td><td>${Admin.badge(r.status)}</td><td>${Admin.money(r.budget)}</td><td>${Admin.money(r.spent)}</td><td>${Admin.esc(r.leads_count??"—")}</td><td><div class="actions"><button class="btn small" onclick="editItem(${r.id})">Edit</button><button class="btn small danger" onclick="removeItem(${r.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="8" class="empty">No records yet.</td></tr>';}
async function load(){let q=supabaseClient.from('campaigns').select('*').order('created_at',{ascending:false});const {data,error}=await q;if(error)return Admin.toast(error.message);dataRows=data||[];const spend=dataRows.reduce((s,x)=>s+Admin.number(x.spent),0),leads=dataRows.reduce((s,x)=>s+Admin.number(x.leads_count),0),budget=dataRows.reduce((s,x)=>s+Admin.number(x.budget),0);summary.innerHTML=[['Campaign Spend',Admin.money(spend)],['Budget',Admin.money(budget)],['Leads',leads],['Avg. CPL',Admin.money(leads?spend/leads:0)]].map(x=>`<div class='card metric'><div class='label'>${x[0]}</div><div class='value'>${x[1]}</div></div>`).join('');render();}
form.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));delete o.id;o.client_id=Admin.id(o.client_id);o.budget=Admin.number(o.budget);o.spent=Admin.number(o.spent);o.leads_count=Admin.number(o.leads_count);Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=editId?await supabaseClient.from('campaigns').update(o).eq('id',editId).select().single():await supabaseClient.from('campaigns').insert(o).select().single();if(res.error)return Admin.toast(res.error.message);await Admin.log(editId?'update':'create','campaigns',res.data?.id||editId);Admin.closeModal();Admin.toast('Saved');load();});
(async()=>{Admin.shell('Campaigns','Marketing performance: budget, spend, leads and cost per lead.');if(await Admin.requireAdmin()){await Promise.all([load(),,initSelects()]);}})();
platformFilter.addEventListener('input',render);statusFilter.addEventListener('change',render);</script></body></html>
