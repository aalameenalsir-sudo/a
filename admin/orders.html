<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الطلبات — لوحة الإدارة</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="min-h-screen bg-background text-foreground">
  <div id="admin-root" class="min-h-screen flex">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 p-4 lg:p-8">
      <div id="header-placeholder"></div>
      <main class="mt-6">
        <h2 class="text-xl font-semibold mb-4">الطلبات</h2>
        <div class="bg-card p-4 rounded-lg shadow overflow-auto">
          <table class="w-full text-sm">
            <thead class="text-muted-foreground text-xs">
              <tr>
                <th class="p-2 text-left">رقم الطلب</th>
                <th class="p-2 text-left">الزبون</th>
                <th class="p-2 text-left">المبلغ</th>
                <th class="p-2 text-left">الحالة</th>
                <th class="p-2 text-left">تاريخ</th>
              </tr>
            </thead>
            <tbody id="orders-table-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="/admin/js/mock-data.js"></script>
  <script src="/admin/js/helpers.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/ui.js"></script>
  <script>
    if (!AdminAuth.isAuthenticated()) location.href = '/admin/login.html?redirect=' + encodeURIComponent(location.pathname + location.search);

    UI.loadComponents().then(()=>{
      const tbody = document.getElementById('orders-table-body');
      MockData.orders.forEach(o => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-2">${o.id}</td>
          <td class="p-2">${o.customer}</td>
          <td class="p-2">${helpers.formatCurrency(o.total)}</td>
          <td class="p-2">${o.status}</td>
          <td class="p-2">${helpers.formatDate(o.date)}</td>
        `;
        tbody.appendChild(tr);
      });
    });
  </script>
</body>
</html>
