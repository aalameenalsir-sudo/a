<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity Log — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="filters"><input id="actionFilter" placeholder="Filter action"><input id="entityFilter" placeholder="Filter entity"><input id="dateFilter" type="date"></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Action</th><th>Entity</th><th>ID</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let all=[];function render(){let x=[...all];if(actionFilter.value)x=x.filter(r=>(r.action||'').toLowerCase().includes(actionFilter.value.toLowerCase()));if(entityFilter.value)x=x.filter(r=>(r.entity_type||'').toLowerCase().includes(entityFilter.value.toLowerCase()));if(dateFilter.value)x=x.filter(r=>(r.created_at||'').slice(0,10)===dateFilter.value);rows.innerHTML=x.length?x.map(r=>`<tr><td>${Admin.datetime(r.created_at)}</td><td>${Admin.esc(r.action)}</td><td>${Admin.esc(r.entity_type||'—')}</td><td>${Admin.esc(r.entity_id||'—')}</td><td>${Admin.esc(JSON.stringify(r.details||{}))}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No activity.</td></tr>'}async function load(){const {data,error}=await supabaseClient.from('activity_log').select('*').order('created_at',{ascending:false}).limit(300);if(error)return Admin.toast(error.message);all=data||[];render()}[actionFilter,entityFilter,dateFilter].forEach(x=>x.addEventListener('input',render));(async()=>{Admin.shell('Activity Log','Read-only audit trail for internal changes.');if(await Admin.requireAdmin())load()})();
</script></body></html>
