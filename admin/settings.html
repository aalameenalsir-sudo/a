<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الإعدادات — لوحة الإدارة</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="min-h-screen bg-background text-foreground">
  <div id="admin-root" class="min-h-screen flex">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 p-4 lg:p-8">
      <div id="header-placeholder"></div>
      <main class="mt-6">
        <h2 class="text-xl font-semibold mb-4">الإعدادات</h2>
        <div class="bg-card p-4 rounded-lg shadow max-w-2xl">
          <label class="flex items-center justify-between mb-4">
            <span>وضع الصيانة</span>
            <input type="checkbox" disabled>
          </label>
          <label class="flex items-center justify-between mb-4">
            <span>تمكين الإشعارات</span>
            <input type="checkbox" checked disabled>
          </label>
          <p class="text-sm text-muted-foreground">هذه إعدادات مكانية قابلة للربط لاحقًا بقاعدة بيانات.</p>
        </div>
      </main>
    </div>
  </div>

  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/ui.js"></script>
  <script>
    if (!AdminAuth.isAuthenticated()) location.href = '/admin/login.html?redirect=' + encodeURIComponent(location.pathname + location.search);
    UI.loadComponents();
  </script>
</body>
</html>
