<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn" onclick="Admin.logout()">Logout</button></div></div><section class="section"><form id="form"><div class="form-grid"><div class="field"><label>Site name</label><input name="site_name"></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>WhatsApp</label><input name="whatsapp"></div><div class="field full"><label>Location</label><input name="location"></div><div class="field"><label>Instagram URL</label><input name="instagram"></div><div class="field"><label>X URL</label><input name="x_url"></div><div class="field"><label>LinkedIn URL</label><input name="linkedin"></div><div class="field"><label>TikTok URL</label><input name="tiktok"></div><div class="field"><label>Snapchat URL</label><input name="snapchat"></div></div><div class="form-actions"><button class="btn primary">Save settings</button></div></form></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let row=null;async function load(){const {data,error}=await supabaseClient.from('settings').select('*').order('id').limit(1).maybeSingle();if(error)return Admin.toast(error.message);row=data;if(row)for(const [k,v] of Object.entries(row))if(form.elements[k])form.elements[k].value=v??''}form.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));for(const k of ['instagram','x_url','linkedin','tiktok','snapchat'])if(o[k]&&!Admin.safeUrl(o[k]))return Admin.toast(`${k} must use http/https`);Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=row?await supabaseClient.from('settings').update(o).eq('id',row.id):await supabaseClient.from('settings').insert(o);if(res.error)return Admin.toast(res.error.message);Admin.toast('Settings saved');load()});(async()=>{Admin.shell('Settings','Public website contact information and social links.');if(await Admin.requireAdmin())load()})();
</script></body></html>
