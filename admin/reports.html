<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div><button class="btn" onclick="Admin.logout()">Logout</button></div><div class="grid" id="metrics"></div><div class="section card"><h2>Management snapshot</h2><p class="sub">Live totals calculated from Supabase. No duplicate reporting table is used.</p></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
const sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0);async function load(){let [o,c,i,p,e,t]=await Promise.all(['opportunities','campaigns','invoices','payments','expenses','tasks'].map(x=>supabaseClient.from(x).select('*')));let inv=sum(i.data||[],'total'),paid=sum(p.data||[],'amount'),exp=sum(e.data||[],'amount'),camp=sum(c.data||[],'spent'),pipe=sum((o.data||[]).filter(x=>!['won','lost'].includes(x.stage)),'estimated_value'),over=(t.data||[]).filter(x=>x.status!=='done'&&x.due_date&&x.due_date<new Date().toISOString().slice(0,10)).length;let data=[['Pipeline',Admin.money(pipe)],['Invoiced',Admin.money(inv)],['Received',Admin.money(paid)],['Outstanding',Admin.money(inv-paid)],['Expenses',Admin.money(exp)],['Net cash',Admin.money(paid-exp)],['Campaign spend',Admin.money(camp)],['Overdue tasks',over]];metrics.innerHTML=data.map(x=>`<div class="card metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}(async()=>{Admin.shell('Reports','Live business performance');if(await Admin.requireAdmin())load()})();</script></body></html>
