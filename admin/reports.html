<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn" onclick="window.print()">Print snapshot</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="grid" id="metrics"></div><div class="split"><section class="section"><div class="section-head"><h2>Sales & marketing</h2></div><div id="sales" class="list"></div></section><section class="section"><div class="section-head"><h2>Finance</h2></div><div id="finance" class="list"></div></section></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
async function load(){const today=new Date().toISOString().slice(0,10);const [op,camp,inv,pay,exp,clients,tasks]=await Promise.all([supabaseClient.from('opportunities').select('stage,estimated_value,probability'),supabaseClient.from('campaigns').select('status,budget,spent,leads_count'),supabaseClient.from('invoices').select('total,paid_amount,status,due_date'),supabaseClient.from('payments').select('amount'),supabaseClient.from('expenses').select('amount'),supabaseClient.from('clients').select('id',{count:'exact'}),supabaseClient.from('tasks').select('status,due_date')]);const O=op.data||[],C=camp.data||[],I=inv.data||[],P=pay.data||[],E=exp.data||[],T=tasks.data||[];const pipeline=O.filter(x=>!['won','lost'].includes(x.stage)).reduce((s,x)=>s+Admin.number(x.estimated_value),0);const won=O.filter(x=>x.stage==='won').reduce((s,x)=>s+Admin.number(x.estimated_value),0);const spend=C.reduce((s,x)=>s+Admin.number(x.spent),0);const leads=C.reduce((s,x)=>s+Admin.number(x.leads_count),0);const invoiced=I.reduce((s,x)=>s+Admin.number(x.total),0);const received=P.reduce((s,x)=>s+Admin.number(x.amount),0);const expenses=E.reduce((s,x)=>s+Admin.number(x.amount),0);const receivables=I.reduce((s,x)=>s+Math.max(0,Admin.number(x.total)-Admin.number(x.paid_amount)),0);const overdue=T.filter(x=>x.due_date&&x.due_date<today&&!['completed','done'].includes(x.status)).length;metrics.innerHTML=[['Pipeline',Admin.money(pipeline)],['Won Sales',Admin.money(won)],['Campaign Spend',Admin.money(spend)],['Receivables',Admin.money(receivables)],['Net Cash',Admin.money(received-expenses)],['Overdue Tasks',overdue],['Clients',clients.count||0],['Leads',leads]].map(x=>`<div class="card metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');sales.innerHTML=[['Open pipeline',Admin.money(pipeline)],['Won sales',Admin.money(won)],['Campaign spend',Admin.money(spend)],['Campaign leads',leads],['Cost per lead',Admin.money(leads?spend/leads:0)]].map(x=>`<div class="statline"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');finance.innerHTML=[['Invoiced',Admin.money(invoiced)],['Received',Admin.money(received)],['Outstanding',Admin.money(receivables)],['Expenses',Admin.money(expenses)],['Net cash',Admin.money(received-expenses)]].map(x=>`<div class="statline"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}(async()=>{Admin.shell('Reports','Live management KPIs calculated from operational records.');if(await Admin.requireAdmin())load()})();
</script></body></html>
