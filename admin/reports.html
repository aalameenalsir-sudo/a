<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>التقارير — لوحة الإدارة</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="min-h-screen bg-background text-foreground">
  <div id="admin-root" class="min-h-screen flex">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 p-4 lg:p-8">
      <div id="header-placeholder"></div>
      <main class="mt-6">
        <h2 class="text-xl font-semibold mb-4">التقارير</h2>
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          <div class="bg-card p-4 rounded-lg shadow">
            <h4 class="font-medium mb-2">مبيعات هذا الأسبوع</h4>
            <div id="report-sales" class="h-32"></div>
          </div>
          <div class="bg-card p-4 rounded-lg shadow">
            <h4 class="font-medium mb-2">زوار الموقع</h4>
            <div id="report-visitors" class="h-32"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/admin/js/mock-data.js"></script>
  <script src="/admin/js/helpers.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/ui.js"></script>
  <script src="/admin/js/dashboard.js"></script>
  <script>
    if (!AdminAuth.isAuthenticated()) location.href = '/admin/login.html?redirect=' + encodeURIComponent(location.pathname + location.search);

    UI.loadComponents().then(()=>{
      Dashboard.renderSmallCharts();
    });
  </script>
</body>
</html>
