<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotation Editor — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="print-sheet"><section class="section"><div class="section-head"><div><h2 id="quoteNo">Quotation</h2><div class="sub" id="quoteMeta"></div></div><div class="actions no-print"><button class="btn primary" onclick="convertToInvoice()">Convert to invoice</button><button class="btn" onclick="window.print()">Print</button><a class="btn" href="quotations.html">Back</a></div></div><div class="form-grid no-print"><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Status</label><select id="status"><option>draft</option><option>sent</option><option>approved</option><option>rejected</option><option>expired</option></select></div><div class="field"><label>Client</label><select id="clientSelect"><option value="">Select client</option></select></div><div class="field"><label>Valid until</label><input id="validUntil" type="date"></div><div class="field full"><label>Notes</label><textarea id="notes"></textarea></div></div><div class="form-actions no-print"><button class="btn primary" onclick="saveHeader()">Save quotation details</button></div></section><section class="section"><div class="section-head"><h2>Line items</h2><button class="btn primary no-print" onclick="newLine()">+ Add item</button></div><div class="table-wrap"><table><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Line total</th><th class="no-print">Actions</th></tr></thead><tbody id="itemRows"></tbody></table></div><div class="totals"><div class="statline"><span>Subtotal</span><b id="subtotal"></b></div><div class="statline"><span>VAT <span id="taxRate"></span>%</span><b id="taxAmount"></b></div><div class="statline"><span>Total</span><b id="total"></b></div></div></section></div><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2>Line item</h2><button class="btn" onclick="Admin.closeModal()">✕</button></div><form id="itemForm"><input type="hidden" name="id"><div class="form-grid"><div class="field full"><label>Description</label><input name="description" required></div><div class="field"><label>Quantity</label><input name="quantity" type="number" step="0.01" min="0" value="1" required></div><div class="field"><label>Unit price</label><input name="unit_price" type="number" step="0.01" min="0" value="0" required></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save item</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
const quoteId=Admin.id(Admin.q('id'));let quote=null,items=[],editLine=null,clientMap={};async function loadClients(){const c=await Admin.loadSelect('#clientSelect','clients',{label:'name',placeholder:'Select client'});clientMap=Object.fromEntries(c.map(x=>[x.id,x.name]))}
async function load(){if(!quoteId){Admin.toast('Missing quotation id');return}const [{data:q,error},{data:i,error:ie}]=await Promise.all([supabaseClient.from('quotations').select('*').eq('id',quoteId).single(),supabaseClient.from('quotation_items').select('*').eq('quotation_id',quoteId).order('id')]);if(error||ie)return Admin.toast((error||ie).message);quote=q;items=i||[];title.value=q.title||'';status.value=q.status;clientSelect.value=q.client_id||'';validUntil.value=q.valid_until||'';notes.value=q.notes||'';quoteNo.textContent=q.quote_number||'Quotation';quoteMeta.textContent=`${clientMap[q.client_id]||'No client'} · ${Admin.date(q.created_at)}`;subtotal.textContent=Admin.money(q.subtotal);taxRate.textContent=q.tax_rate;taxAmount.textContent=Admin.money(q.tax_amount);total.textContent=Admin.money(q.total);itemRows.innerHTML=items.length?items.map(x=>`<tr><td>${Admin.esc(x.description)}</td><td>${Admin.esc(x.quantity)}</td><td>${Admin.money(x.unit_price)}</td><td>${Admin.money(x.line_total)}</td><td class="no-print"><div class="actions"><button class="btn small" onclick="editItem(${x.id})">Edit</button><button class="btn small danger" onclick="removeItem(${x.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Add your first quotation item.</td></tr>'}
async function saveHeader(){const o={title:title.value.trim(),status:status.value,client_id:Admin.id(clientSelect.value),valid_until:validUntil.value||null,notes:notes.value||null};const {error}=await supabaseClient.from('quotations').update(o).eq('id',quoteId);if(error)return Admin.toast(error.message);Admin.toast('Quotation saved');load()}
async function convertToInvoice(){if(!quote)return;if(!confirm('Create an invoice from this quotation and copy all line items?'))return;const invoiceNumber=Admin.generateNumber('INV');const payload={invoice_number:invoiceNumber,client_id:quote.client_id,quotation_id:quote.id,status:'draft',issue_date:new Date().toISOString().slice(0,10),tax_rate:quote.tax_rate,notes:'Created from '+(quote.quote_number||'quotation')};const {data:inv,error}=await supabaseClient.from('invoices').insert(payload).select().single();if(error)return Admin.toast(error.message);if(items.length){const rows=items.map(x=>({invoice_id:inv.id,description:x.description,quantity:x.quantity,unit_price:x.unit_price}));const {error:ie}=await supabaseClient.from('invoice_items').insert(rows);if(ie){Admin.toast('Invoice created, but items could not be copied: '+ie.message);return}}await Admin.log('convert','quotation_to_invoice',quote.id,{invoice_id:inv.id});location.href='invoice-edit.html?id='+inv.id}
function newLine(){editLine=null;itemForm.reset();itemForm.quantity.value=1;itemForm.unit_price.value=0;Admin.openModal()}function editItem(id){const x=items.find(i=>i.id===id);editLine=id;itemForm.description.value=x.description;itemForm.quantity.value=x.quantity;itemForm.unit_price.value=x.unit_price;Admin.openModal()}async function removeItem(id){if(!confirm('Delete item?'))return;const {error}=await supabaseClient.from('quotation_items').delete().eq('id',id);if(error)return Admin.toast(error.message);await load()}
itemForm.addEventListener('submit',async e=>{e.preventDefault();const o={quotation_id:quoteId,description:itemForm.description.value.trim(),quantity:Admin.number(itemForm.quantity.value),unit_price:Admin.number(itemForm.unit_price.value)};const res=editLine?await supabaseClient.from('quotation_items').update(o).eq('id',editLine):await supabaseClient.from('quotation_items').insert(o);if(res.error)return Admin.toast(res.error.message);Admin.closeModal();await load()});(async()=>{Admin.shell('Quotation Editor','Add services, quantities and prices; totals are recalculated by the database.');if(await Admin.requireAdmin()){await loadClients();await load()}})();
</script></body></html>
