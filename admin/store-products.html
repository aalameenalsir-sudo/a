<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Commerce — Products</title><link rel="stylesheet" href="../store/store.css"><style>.product-editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:25px 0;padding:20px;border:1px solid var(--line)}.product-editor .full{grid-column:1/-1}.type-fields{display:none}.type-fields.active{display:contents}@media(max-width:700px){.product-editor{grid-template-columns:1fr}}</style></head><body><div class="admin-shell"><aside class="admin-nav"><h2>A SOLUTION</h2><small>COMMERCE</small><a href="store-dashboard.html">Dashboard</a><a href="store-orders.html">Orders</a><a href="store-products.html">Products</a><a href="store-customers.html">Customers / CRM</a><a href="store-coupons.html">Coupons</a><a href="store-payments.html">Payments</a><a href="store-returns.html">Returns</a><a href="store-reviews.html">Reviews</a><a href="store-reports.html">Reports</a><a href="store-settings.html">Settings</a></aside><main class="admin-main"><p class="section-no">COMMERCE / CATALOG</p><h1>PRODUCTS & INVENTORY</h1><button class="primary" id="new-product">+ NEW PRODUCT</button><form id="product-editor" class="product-editor" hidden><input type="hidden" name="id"><label class="field"><span>Type</span><select name="type"><option value="service">Service</option><option value="digital">Digital</option><option value="physical">Physical</option></select></label><label class="field"><span>Status</span><select name="status"><option value="active">Active</option><option value="draft">Draft</option><option value="archived">Archived</option></select></label><label class="field"><span>Slug</span><input name="slug" required></label><label class="field"><span>SKU</span><input name="sku"></label><label class="field"><span>Category</span><select name="category_id" id="product-category"></select></label><label class="field"><span>Name EN</span><input name="name_en" required></label><label class="field"><span>Name AR</span><input name="name_ar" required></label><label class="field"><span>Price</span><input name="price" type="number" min="0" step="0.01" required></label><label class="field"><span>Compare at</span><input name="compare_at_price" type="number" min="0" step="0.01"></label><label class="field full"><span>Description EN</span><textarea name="description_en"></textarea></label><label class="field full"><span>Description AR</span><textarea name="description_ar"></textarea></label><div class="type-fields" data-type="physical"><label class="field"><span>Inventory</span><input name="inventory_qty" type="number" min="0"></label><label class="field"><span>Low stock alert</span><input name="low_stock_threshold" type="number" min="0" value="5"></label><label><input name="track_inventory" type="checkbox"> Track inventory</label><label><input name="pickup_allowed" type="checkbox"> Pickup</label><label><input name="cod_allowed" type="checkbox"> COD</label><label><input name="returnable" type="checkbox" checked> Returnable</label></div><div class="type-fields" data-type="digital"><label class="field"><span>Download limit</span><input name="download_limit" type="number" min="1"></label><label class="field"><span>Expiry hours</span><input name="download_expiry_hours" type="number" min="1"></label></div><div class="type-fields" data-type="service"><label class="field"><span>Duration minutes</span><input name="service_duration_minutes" type="number" min="1"></label><label><input name="service_requires_appointment" type="checkbox"> Requires appointment</label></div><label><input name="featured" type="checkbox"> Featured</label><label><input name="active" type="checkbox" checked> Publicly active</label><div class="full"><button class="primary" type="submit">SAVE PRODUCT</button> <button class="pill" type="button" id="cancel-edit">CANCEL</button></div><p id="product-status" class="full"></p></form><div class="toolbar"><input id="product-search" placeholder="Search"><button class="pill" id="refresh-products">Refresh</button></div><table class="table"><thead><tr><th>SKU</th><th>Product</th><th>Type</th><th>Price</th><th>Inventory</th><th>Status</th><th>Action</th></tr></thead><tbody id="products-body"></tbody></table></main></div><script src="store-admin.js"></script><script src="store-products-live.js"></script></body></html>
