<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Commerce — Store Settings</title><link rel="stylesheet" href="../store/store.css"><style>.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.settings-grid .full{grid-column:1/-1}.settings-group{grid-column:1/-1;border-top:1px solid var(--line);padding-top:20px;margin-top:10px}.check-row{display:flex;gap:15px;flex-wrap:wrap}.policy{min-height:120px}@media(max-width:720px){.settings-grid{grid-template-columns:1fr}.settings-grid .full,.settings-group{grid-column:1}}</style></head><body><div class="admin-shell"><aside class="admin-nav"><h2>A SOLUTION</h2><small>COMMERCE</small><a href="store-dashboard.html">Dashboard</a><a href="store-orders.html">Orders</a><a href="store-products.html">Products</a><a href="store-customers.html">Customers / CRM</a><a href="store-coupons.html">Coupons</a><a href="store-payments.html">Payments</a><a href="store-returns.html">Returns</a><a href="store-reviews.html">Reviews</a><a href="store-reports.html">Reports</a><a href="store-settings.html">Settings</a></aside><main class="admin-main"><p class="section-no">COMMERCE / WHITE LABEL</p><h1>STORE SETTINGS</h1><form id="settings-form" class="settings-grid"><h3 class="settings-group">Brand</h3><label class="field"><span>Store name</span><input name="store_name"></label><label class="field"><span>Arabic store name</span><input name="store_name_ar"></label><label class="field"><span>Logo URL</span><input name="logo_url"></label><label class="field"><span>Favicon URL</span><input name="favicon_url"></label><label class="field"><span>Accent</span><input name="accent" type="color"></label><label class="field"><span>Paper</span><input name="paper" type="color"></label><label class="field"><span>Ink</span><input name="ink" type="color"></label><label class="field"><span>Currency</span><input name="currency"></label><label class="field"><span>VAT rate (0.15 = 15%)</span><input name="vat_rate" type="number" min="0" max="1" step="0.01"></label><label class="field"><span>Tax number</span><input name="tax_number"></label><label class="field"><span>Commercial registration</span><input name="commercial_registration"></label><h3 class="settings-group">Bank & Payments</h3><label class="field"><span>Bank name</span><input name="bank_name"></label><label class="field"><span>Beneficiary</span><input name="bank_beneficiary"></label><label class="field"><span>IBAN</span><input name="bank_iban"></label><label class="field"><span>Account number</span><input name="bank_account_number"></label><div class="full check-row" id="payment-methods"></div><label><input type="checkbox" name="cod_enabled"> Enable COD</label><h3 class="settings-group">Shipping & Pickup</h3><label><input type="checkbox" name="pickup_enabled"> Enable branch pickup</label><label class="field"><span>Flat shipping rate</span><input name="flat_shipping_rate" type="number" min="0" step="0.01"></label><label class="field"><span>Free shipping threshold</span><input name="free_shipping_threshold" type="number" min="0" step="0.01"></label><label class="field"><span>Shipping provider</span><input name="shipping_provider"></label><h3 class="settings-group">Contact & Social</h3><label class="field"><span>Email</span><input name="contact_email" type="email"></label><label class="field"><span>Phone</span><input name="contact_phone"></label><label class="field"><span>WhatsApp</span><input name="whatsapp"></label><label class="field"><span>Instagram</span><input name="instagram"></label><label class="field"><span>Facebook</span><input name="facebook"></label><label class="field"><span>LinkedIn</span><input name="linkedin"></label><label class="field"><span>TikTok</span><input name="tiktok"></label><h3 class="settings-group">SEO & Legal</h3><label class="field full"><span>SEO title</span><input name="seo_title"></label><label class="field full"><span>SEO description</span><textarea name="seo_description"></textarea></label><label class="field full"><span>Return policy</span><textarea class="policy" name="return_policy"></textarea></label><label class="field full"><span>Privacy policy</span><textarea class="policy" name="privacy_policy"></textarea></label><label class="field full"><span>Terms</span><textarea class="policy" name="terms_policy"></textarea></label><label class="field full"><span>Invoice footer</span><textarea name="invoice_footer"></textarea></label><div class="full"><button class="primary" type="submit">SAVE SETTINGS</button><p id="settings-status"></p></div></form></main></div><script src="store-admin.js"></script><script src="store-settings.js"></script></body></html>
