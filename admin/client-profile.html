<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Profile — A Solution</title><link rel="stylesheet" href="admin-common.css"><style>.client-hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}.client-name{font-size:38px;margin:0}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.summary-card{border:1px solid #e4e7ec;border-radius:16px;padding:18px;background:#fff}.summary-card b{display:block;font-size:24px;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.mini-list{display:grid;gap:10px}.mini{border:1px solid #e7e9ee;border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:18px}.empty2{color:#8b9098;padding:12px 0}@media(max-width:900px){.summary-grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.client-hero{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><a class="btn" href="clients.html">Back</a><button class="btn" onclick="Admin.logout()">Logout</button></div></div>
<section class="section"><div class="client-hero"><div><p class="sub">CLIENT 360°</p><h2 class="client-name" id="clientName">Client</h2><div class="sub" id="clientMeta"></div></div><div class="actions"><a class="btn primary" id="wa" target="_blank">WhatsApp</a><a class="btn" id="mail">Email</a><a class="btn" id="timeline">Activity Timeline</a></div></div></section>
<div class="summary-grid"><div class="summary-card"><span>Pipeline</span><b id="pipeline">SAR 0</b></div><div class="summary-card"><span>Invoiced</span><b id="invoiced">SAR 0</b></div><div class="summary-card"><span>Received</span><b id="received">SAR 0</b></div><div class="summary-card"><span>Outstanding</span><b id="outstanding">SAR 0</b></div></div>
<div class="two" style="margin-top:18px"><section class="section"><div class="section-head"><h2>Opportunities</h2><a class="btn small" href="opportunities.html">Open module</a></div><div id="opps" class="mini-list"></div></section><section class="section"><div class="section-head"><h2>Client Projects</h2><a class="btn small" href="client-projects.html">Open module</a></div><div id="projects" class="mini-list"></div></section></div>
<div class="two"><section class="section"><div class="section-head"><h2>Quotations</h2><a class="btn small" href="quotations.html">Open module</a></div><div id="quotes" class="mini-list"></div></section><section class="section"><div class="section-head"><h2>Invoices</h2><a class="btn small" href="invoices.html">Open module</a></div><div id="invoiceList" class="mini-list"></div></section></div>
<div class="two"><section class="section"><div class="section-head"><h2>Contracts</h2><a class="btn small" href="contracts.html">Open module</a></div><div id="contracts" class="mini-list"></div></section><section class="section"><div class="section-head"><h2>Recent activity</h2><a class="btn small" id="timeline2">Full timeline</a></div><div id="activities" class="mini-list"></div></section></div>
</main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
const id=Admin.id(Admin.q('id'));const empty=el=>el.innerHTML='<div class="empty2">No records yet.</div>';const mini=(title,meta,href='')=>`<${href?'a':'div'} class="mini" ${href?`href="${href}"`:''}><b>${Admin.esc(title||'—')}</b><span>${meta||''}</span></${href?'a':'div'}>`;
async function load(){if(!id)return Admin.toast('Missing client id');const [c,o,p,q,i,ct,a]=await Promise.all([supabaseClient.from('clients').select('*').eq('id',id).single(),supabaseClient.from('opportunities').select('*').eq('client_id',id).order('created_at',{ascending:false}),supabaseClient.from('client_projects').select('*').eq('client_id',id).order('created_at',{ascending:false}),supabaseClient.from('quotations').select('*').eq('client_id',id).order('created_at',{ascending:false}),supabaseClient.from('invoices').select('*').eq('client_id',id).order('created_at',{ascending:false}),supabaseClient.from('contracts').select('*').eq('client_id',id).order('created_at',{ascending:false}),supabaseClient.from('crm_activities').select('*').eq('client_id',id).order('activity_date',{ascending:false}).limit(6)]);if(c.error)return Admin.toast(c.error.message);const x=c.data;clientName.textContent=x.company||x.name||'Client';clientMeta.textContent=[x.name,x.email,x.phone,Admin.badge(x.status)].filter(Boolean).join(' · ');const phone=(x.phone||'').replace(/\D/g,'');wa.href=phone?`https://wa.me/${phone}`:'#';mail.href=x.email?`mailto:${x.email}`:'#';timeline.href='crm.html?client='+id;timeline2.href='crm.html?client='+id;const oppsD=o.data||[],projD=p.data||[],qD=q.data||[],invD=i.data||[],ctD=ct.data||[],aD=a.data||[];pipeline.textContent=Admin.money(oppsD.filter(z=>!['won','lost'].includes(z.stage)).reduce((s,z)=>s+Number(z.estimated_value||0),0));invoiced.textContent=Admin.money(invD.reduce((s,z)=>s+Number(z.total||0),0));received.textContent=Admin.money(invD.reduce((s,z)=>s+Number(z.paid_amount||0),0));outstanding.textContent=Admin.money(invD.reduce((s,z)=>s+Math.max(0,Number(z.total||0)-Number(z.paid_amount||0)),0));opps.innerHTML=oppsD.length?oppsD.slice(0,6).map(z=>mini(z.title,Admin.badge(z.stage)+' · '+Admin.money(z.estimated_value))).join(''):'';if(!oppsD.length)empty(opps);projects.innerHTML=projD.length?projD.slice(0,6).map(z=>mini(z.name,Admin.badge(z.status)+' · '+Admin.money(z.budget))).join(''):'';if(!projD.length)empty(projects);quotes.innerHTML=qD.length?qD.slice(0,6).map(z=>mini(z.quote_number||z.title,Admin.badge(z.status)+' · '+Admin.money(z.total),'quotation-edit.html?id='+z.id)).join(''):'';if(!qD.length)empty(quotes);invoiceList.innerHTML=invD.length?invD.slice(0,6).map(z=>mini(z.invoice_number,Admin.badge(z.status)+' · '+Admin.money(z.total),'invoice-edit.html?id='+z.id)).join(''):'';if(!invD.length)empty(invoiceList);contracts.innerHTML=ctD.length?ctD.slice(0,6).map(z=>mini(z.title,Admin.badge(z.status)+' · '+Admin.money(z.value))).join(''):'';if(!ctD.length)empty(contracts);activities.innerHTML=aD.length?aD.map(z=>mini(z.subject||z.activity_type,Admin.date(z.activity_date))).join(''):'';if(!aD.length)empty(activities)}
(async()=>{Admin.shell('Client Profile','One place for the complete customer relationship.');if(await Admin.requireAdmin())load()})();
</script></body></html>
