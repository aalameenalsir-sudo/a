<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Solution — Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff6b6b, #c44569, #574b90);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    h1 {
      margin: 0 0 10px;
      color: #1a1a1a;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #1a1a1a;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #c44569;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff6b6b, #c44569, #574b90);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
      color: #c44569;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>A Solution</h1>
    <p class="subtitle">Admin Panel Login</p>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

      <div id="message"></div>

    </form>

  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.style.color = "#c44569";
      message.textContent = "Checking...";

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          message.textContent = "Login error: " + error.message;

          loginButton.disabled = false;
          loginButton.textContent = "Login";
          return;
        }

        if (!data.session) {
          message.textContent = "Login failed: No session created.";

          loginButton.disabled = false;
          loginButton.textContent = "Login";
          return;
        }

        message.style.color = "green";
        message.textContent = "Login successful...";

        window.location.href = "dashboard.html";

      } catch (err) {

        console.error(err);

        message.textContent =
          "Connection error: " + err.message;

        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }

    });
  </script>

</body>
</html>
