<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة التحكم — Dashboard</title>
  <link rel="icon" href="../favicon.png">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body class="min-h-screen bg-background text-foreground">
  <!-- Header & Sidebar injected by components -->
  <div id="admin-root" class="min-h-screen flex">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 p-4 lg:p-8">
      <div id="header-placeholder"></div>

      <main class="mt-6">
        <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <!-- Stat cards -->
          <div id="stat-cards"></div>
        </section>

        <section class="mt-6 grid gap-4 lg:grid-cols-3">
          <div class="lg:col-span-2 bg-card p-4 rounded-lg shadow">
            <h3 class="text-lg font-semibold mb-4">مخطط المبيعات</h3>
            <div id="sales-chart" class="h-56"></div>
          </div>

          <div class="bg-card p-4 rounded-lg shadow">
            <h3 class="text-lg font-semibold mb-4">النشاط الأخير</h3>
            <div id="recent-activity" class="space-y-3"></div>
          </div>
        </section>

        <section class="mt-6 bg-card p-4 rounded-lg shadow">
          <h3 class="text-lg font-semibold mb-4">إجراءات سريعة</h3>
          <div id="quick-actions" class="flex gap-2 flex-wrap"></div>
        </section>

      </main>

    </div>
  </div>

  <script src="./js/mock-data.js"></script>
  <script src="./js/helpers.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/dashboard.js"></script>
  <script>
    // Protect page
    if (!window.AdminAuth || !AdminAuth.isAuthenticated()) {
      window.location.href = './login.html?redirect=' + encodeURIComponent(location.pathname + location.search);
    }

    // Initialize UI and dashboard
    UI.loadComponents().then(()=>{
      Dashboard.init();
    });
  </script>
</body>
</html>
