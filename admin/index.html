<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Solution Admin</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="login-page"><div class="login-card"><div class="brandline"><div class="brand" style="color:#111827;padding:0">A <span>Solution</span></div><div class="sub">Secure internal management system</div></div><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div><div class="field" style="margin-top:12px"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:18px">Sign in</button><div id="error" class="error"></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>const form=document.getElementById('loginForm');(async()=>{const {data:{session}}=await supabaseClient.auth.getSession();if(session)location.href='dashboard.html'})();form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const {email,password}=Object.fromEntries(new FormData(form));const {data,err,error:authError}=await supabaseClient.auth.signInWithPassword({email,password});const er=authError||err;if(er){error.textContent=er.message;return}const {data:p,error:pe}=await supabaseClient.from('profiles').select('role').eq('id',data.user.id).single();if(pe||p?.role!=='admin'){await supabaseClient.auth.signOut();error.textContent='This account does not have admin access.';return}location.href='dashboard.html'});</script></body></html>
