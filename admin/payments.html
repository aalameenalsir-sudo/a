<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ Add</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Client</th><th>Invoice</th><th>Amount</th><th>Method</th><th>Reference</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Payments</h2><button class="btn" type="button" onclick="Admin.closeModal()">✕</button></div><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field "><label>Invoice</label><select name="invoice_id" id="invoiceSelect"></select></div><div class="field "><label>Client</label><select name="client_id" id="clientSelect"></select></div><div class="field "><label>Amount</label><input type="number" name="amount" required step="0.01" min="0"></div><div class="field "><label>Payment date</label><input type="date" name="payment_date"  ></div><div class="field "><label>Method</label><select name="method" id="method"><option value="bank_transfer">Bank transfer</option><option value="cash">Cash</option><option value="card">Card</option><option value="cheque">Cheque</option><option value="other">Other</option></select></div><div class="field "><label>Reference</label><input type="text" name="reference"  ></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let dataRows=[];let editId=null;let clientMap={},invoiceMap={};async function initSelects(){let [c,i]=await Promise.all([Admin.loadSelect('#clientSelect','clients',{label:'name',placeholder:'Select client'}),Admin.loadSelect('#invoiceSelect','invoices',{label:'invoice_number',placeholder:'Select invoice'})]);clientMap=Object.fromEntries(c.map(x=>[x.id,x.name]));invoiceMap=Object.fromEntries(i.map(x=>[x.id,x.invoice_number]));}
function newItem(){editId=null;form.reset();form.id.value='';document.getElementById('modalTitle').textContent='Add Payments';Admin.openModal();}
function editItem(id){const r=dataRows.find(x=>x.id===id);if(!r)return;editId=id;form.reset();for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=v??'';document.getElementById('modalTitle').textContent='Edit Payments';Admin.openModal();}
async function removeItem(id){if(!confirm('Delete this record?'))return;const {error}=await supabaseClient.from('payments').delete().eq('id',id);if(error)return Admin.toast(error.message);await Admin.log('delete','payments',id);Admin.toast('Deleted');load();}
function render(){let list=[...dataRows];rows.innerHTML=list.length?list.map(r=>`<tr><td>${Admin.date(r.payment_date)}</td><td>${Admin.esc(clientMap[r.client_id]||"—")}</td><td>${Admin.esc(invoiceMap[r.invoice_id]||"—")}</td><td>${Admin.money(r.amount)}</td><td>${Admin.esc(r.method??"—")}</td><td>${Admin.esc(r.reference??"—")}</td><td><div class="actions"><button class="btn small" onclick="editItem(${r.id})">Edit</button><button class="btn small danger" onclick="removeItem(${r.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No records yet.</td></tr>';}
async function load(){let q=supabaseClient.from('payments').select('*').order('created_at',{ascending:false});const {data,error}=await q;if(error)return Admin.toast(error.message);dataRows=data||[];render();}
form.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));delete o.id;o.invoice_id=Admin.id(o.invoice_id);o.client_id=Admin.id(o.client_id);o.amount=Admin.number(o.amount);Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=editId?await supabaseClient.from('payments').update(o).eq('id',editId).select().single():await supabaseClient.from('payments').insert(o).select().single();if(res.error)return Admin.toast(res.error.message);await Admin.log(editId?'update':'create','payments',res.data?.id||editId);Admin.closeModal();Admin.toast('Saved');load();});
(async()=>{Admin.shell('Payments','Record receipts and keep invoice paid amounts synchronized.');if(await Admin.requireAdmin()){await Promise.all([load(),,initSelects()]);}})();
</script></body></html>
