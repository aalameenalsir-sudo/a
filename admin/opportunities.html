<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opportunities — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ Add</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="grid" id="summary"></div><div class="filters"><select id="stageFilter"><option value="">All stages</option><option>lead</option><option>qualified</option><option>proposal</option><option>negotiation</option><option>won</option><option>lost</option></select></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Title</th><th>Client</th><th>Owner</th><th>Stage</th><th>Value</th><th>Probability</th><th>Close date</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Opportunities</h2><button class="btn" type="button" onclick="Admin.closeModal()">✕</button></div><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field "><label>Opportunity title</label><input type="text" name="title" required ></div><div class="field "><label>Client</label><select name="client_id" id="clientSelect"></select></div><div class="field "><label>Owner employee</label><select name="owner_id" id="ownerSelect"></select></div><div class="field "><label>Stage</label><select name="stage" id="stage"><option value="lead">Lead</option><option value="qualified">Qualified</option><option value="proposal">Proposal</option><option value="negotiation">Negotiation</option><option value="won">Won</option><option value="lost">Lost</option></select></div><div class="field "><label>Estimated value</label><input type="number" name="estimated_value"  step="0.01" min="0"></div><div class="field "><label>Probability %</label><input type="number" name="probability"  min="0" max="100"></div><div class="field "><label>Expected close</label><input type="date" name="expected_close_date"  ></div><div class="field "><label>Source</label><input type="text" name="source"  ></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let dataRows=[];let editId=null;let clientMap={},employeeMap={};async function initSelects(){let [c,e]=await Promise.all([Admin.loadSelect('#clientSelect','clients',{label:'name',placeholder:'Select client'}),Admin.loadSelect('#ownerSelect','employees',{label:'name',placeholder:'Select owner'})]);clientMap=Object.fromEntries(c.map(x=>[x.id,x.name]));employeeMap=Object.fromEntries(e.map(x=>[x.id,x.name]));}
function newItem(){editId=null;form.reset();form.id.value='';document.getElementById('modalTitle').textContent='Add Opportunities';Admin.openModal();}
function editItem(id){const r=dataRows.find(x=>x.id===id);if(!r)return;editId=id;form.reset();for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=v??'';document.getElementById('modalTitle').textContent='Edit Opportunities';Admin.openModal();}
async function removeItem(id){if(!confirm('Delete this record?'))return;const {error}=await supabaseClient.from('opportunities').delete().eq('id',id);if(error)return Admin.toast(error.message);await Admin.log('delete','opportunities',id);Admin.toast('Deleted');load();}
function render(){let list=[...dataRows];if(stageFilter.value)list=list.filter(r=>r.stage===stageFilter.value);rows.innerHTML=list.length?list.map(r=>`<tr><td>${Admin.esc(r.title??"—")}</td><td>${Admin.esc(clientMap[r.client_id]||"—")}</td><td>${Admin.esc(employeeMap[r.owner_id]||"—")}</td><td>${Admin.badge(r.stage)}</td><td>${Admin.money(r.estimated_value)}</td><td>${Admin.esc(r.probability??"—")}</td><td>${Admin.date(r.expected_close_date)}</td><td><div class="actions"><button class="btn small" onclick="editItem(${r.id})">Edit</button><button class="btn small danger" onclick="removeItem(${r.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="8" class="empty">No records yet.</td></tr>';}
async function load(){let q=supabaseClient.from('opportunities').select('*').order('created_at',{ascending:false});const {data,error}=await q;if(error)return Admin.toast(error.message);dataRows=data||[];const open=dataRows.filter(x=>!['won','lost'].includes(x.stage));const won=dataRows.filter(x=>x.stage==='won');summary.innerHTML=[['Pipeline',Admin.money(open.reduce((s,x)=>s+Admin.number(x.estimated_value),0))],['Opportunities',dataRows.length],['Won value',Admin.money(won.reduce((s,x)=>s+Admin.number(x.estimated_value),0))],['Weighted value',Admin.money(open.reduce((s,x)=>s+Admin.number(x.estimated_value)*Admin.number(x.probability)/100,0))]].map(x=>`<div class='card metric'><div class='label'>${x[0]}</div><div class='value'>${x[1]}</div></div>`).join('');render();}
form.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));delete o.id;o.client_id=Admin.id(o.client_id);o.owner_id=Admin.id(o.owner_id);o.estimated_value=Admin.number(o.estimated_value);o.probability=Admin.number(o.probability);Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=editId?await supabaseClient.from('opportunities').update(o).eq('id',editId).select().single():await supabaseClient.from('opportunities').insert(o).select().single();if(res.error)return Admin.toast(res.error.message);await Admin.log(editId?'update':'create','opportunities',res.data?.id||editId);Admin.closeModal();Admin.toast('Saved');load();});
(async()=>{Admin.shell('Opportunities','Sales pipeline with client, owner, value and probability.');if(await Admin.requireAdmin()){await Promise.all([load(),,initSelects()]);}})();
stageFilter.addEventListener('change',render);</script></body></html>
