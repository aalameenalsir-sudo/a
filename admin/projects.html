<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Solution — Projects Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #1a1a1a;
    }

    header {
      background: linear-gradient(90deg, #ff6b6b, #c44569, #574b90);
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    button,
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .back-btn {
      background: white;
      color: #574b90;
    }

    .logout-btn {
      background: white;
      color: #c44569;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
    }

    .panel {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    .panel h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .save-btn {
      background: #574b90;
      color: white;
    }

    .cancel-btn {
      background: #eee;
      color: #333;
      display: none;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
    }

    .error {
      color: #c0392b;
    }

    .success {
      color: #1e8449;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .project-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }

    .project-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #eee;
    }

    .project-content {
      padding: 18px;
    }

    .project-content h3 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .project-content p {
      color: #666;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .published {
      background: #d5f5e3;
      color: #1e8449;
    }

    .hidden {
      background: #f2f3f4;
      color: #666;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .edit-btn {
      background: #f4d03f;
      color: #222;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .toggle-btn {
      background: #3498db;
      color: white;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Projects Management</h1>

    <div class="header-actions">
      <a href="dashboard.html" class="btn back-btn">Dashboard</a>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main>

    <div class="panel">
      <h2 id="formTitle">Add New Project</h2>

      <form id="projectForm">
        <div class="form-grid">

          <div>
            <label for="title">Project Title</label>
            <input
              type="text"
              id="title"
              required
              placeholder="Enter project title"
            >
          </div>

          <div>
            <label for="projectUrl">Project URL</label>
            <input
              type="url"
              id="projectUrl"
              placeholder="https://example.com"
            >
          </div>

          <div class="full">
            <label for="description">Description</label>
            <textarea
              id="description"
              placeholder="Write project description"
            ></textarea>
          </div>

          <div class="full">
            <label for="imageUrl">Image URL</label>
            <input
              type="url"
              id="imageUrl"
              placeholder="https://example.com/image.jpg"
            >
          </div>

          <div>
            <label for="published">Status</label>
            <select id="published">
              <option value="true">Published</option>
              <option value="false">Hidden</option>
            </select>
          </div>

        </div>

        <div style="margin-top:20px;">
          <button type="submit" class="save-btn" id="saveBtn">
            Add Project
          </button>

          <button type="button" class="cancel-btn" id="cancelBtn">
            Cancel Edit
          </button>
        </div>

        <div class="status" id="status"></div>
      </form>
    </div>

    <div class="panel">
      <h2>Projects</h2>
      <div class="projects-grid" id="projectsGrid">
        <div class="empty">Loading projects...</div>
      </div>
    </div>

  </main>

  <script>
    const projectForm = document.getElementById("projectForm");
    const titleInput = document.getElementById("title");
    const descriptionInput = document.getElementById("description");
    const imageUrlInput = document.getElementById("imageUrl");
    const projectUrlInput = document.getElementById("projectUrl");
    const publishedInput = document.getElementById("published");

    const projectsGrid = document.getElementById("projectsGrid");
    const status = document.getElementById("status");

    const saveBtn = document.getElementById("saveBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const formTitle = document.getElementById("formTitle");

    let editingProjectId = null;

    async function checkAdminAccess() {
      try {
        const {
          data: { session },
          error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
          throw sessionError;
        }

        if (!session) {
          window.location.href = "index.html";
          return false;
        }

        const {
          data: profile,
          error: profileError
        } = await supabaseClient
          .from("profiles")
          .select("role")
          .eq("id", session.user.id)
          .single();

        if (profileError) {
          throw profileError;
        }

        if (!profile || profile.role !== "admin") {
          await supabaseClient.auth.signOut();
          window.location.href = "index.html";
          return false;
        }

        return true;

      } catch (error) {
        console.error(error);
        alert("Unable to verify admin access.");
        return false;
      }
    }

    async function loadProjects() {
      projectsGrid.innerHTML =
        '<div class="empty">Loading projects...</div>';

      const {
        data,
        error
      } = await supabaseClient
        .from("projects")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        projectsGrid.innerHTML =
          '<div class="empty">Error loading projects.</div>';
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        projectsGrid.innerHTML =
          '<div class="empty">No projects added yet.</div>';
        return;
      }

      projectsGrid.innerHTML = "";

      data.forEach(project => {
        const card = document.createElement("div");
        card.className = "project-card";

        const safeImage =
          project.image_url ||
          "https://via.placeholder.com/600x400?text=A+Solution";

        card.innerHTML = `
          <img src="${safeImage}" alt="${escapeHtml(project.title || "Project")}">

          <div class="project-content">

            <span class="badge ${project.is_published ? "published" : "hidden"}">
              ${project.is_published ? "Published" : "Hidden"}
            </span>

            <h3>${escapeHtml(project.title || "")}</h3>

            <p>${escapeHtml(project.description || "")}</p>

            ${
              project.project_url
              ? `<p>
                  <a href="${project.project_url}" target="_blank">
                    View Project
                  </a>
                </p>`
              : ""
            }

            <div class="card-actions">

              <button
                class="edit-btn"
                onclick='editProject(${JSON.stringify(project)})'
              >
                Edit
              </button>

              <button
                class="toggle-btn"
                onclick="toggleProject(${project.id}, ${project.is_published})"
              >
                ${project.is_published ? "Hide" : "Publish"}
              </button>

              <button
                class="delete-btn"
                onclick="deleteProject(${project.id})"
              >
                Delete
              </button>

            </div>

          </div>
        `;

        projectsGrid.appendChild(card);
      });
    }

    projectForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      status.textContent = "Saving...";
      status.className = "status";

      saveBtn.disabled = true;

      const projectData = {
        title: titleInput.value.trim(),
        description: descriptionInput.value.trim(),
        image_url: imageUrlInput.value.trim(),
        project_url: projectUrlInput.value.trim(),
        is_published: publishedInput.value === "true"
      };

      try {
        let result;

        if (editingProjectId) {
          result = await supabaseClient
            .from("projects")
            .update(projectData)
            .eq("id", editingProjectId);
        } else {
          result = await supabaseClient
            .from("projects")
            .insert(projectData);
        }

        if (result.error) {
          throw result.error;
        }

        status.textContent =
          editingProjectId
            ? "Project updated successfully."
            : "Project added successfully.";

        status.className = "status success";

        resetForm();
        await loadProjects();

      } catch (error) {
        console.error(error);

        status.textContent =
          "Error: " + error.message;

        status.className = "status error";

      } finally {
        saveBtn.disabled = false;
      }
    });

    function editProject(project) {
      editingProjectId = project.id;

      titleInput.value = project.title || "";
      descriptionInput.value = project.description || "";
      imageUrlInput.value = project.image_url || "";
      projectUrlInput.value = project.project_url || "";
      publishedInput.value =
        project.is_published ? "true" : "false";

      formTitle.textContent = "Edit Project";
      saveBtn.textContent = "Save Changes";
      cancelBtn.style.display = "inline-block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    async function toggleProject(id, currentStatus) {
      const {
        error
      } = await supabaseClient
        .from("projects")
        .update({
          is_published: !currentStatus
        })
        .eq("id", id);

      if (error) {
        alert("Error: " + error.message);
        return;
      }

      await loadProjects();
    }

    async function deleteProject(id) {
      const confirmed = confirm(
        "Are you sure you want to delete this project?"
      );

      if (!confirmed) {
        return;
      }

      const {
        error
      } = await supabaseClient
        .from("projects")
        .delete()
        .eq("id", id);

      if (error) {
        alert("Error: " + error.message);
        return;
      }

      await loadProjects();
    }

    function resetForm() {
      projectForm.reset();

      editingProjectId = null;

      formTitle.textContent = "Add New Project";
      saveBtn.textContent = "Add Project";
      cancelBtn.style.display = "none";
    }

    cancelBtn.addEventListener("click", function() {
      resetForm();

      status.textContent = "";
      status.className = "status";
    });

    document
      .getElementById("logoutBtn")
      .addEventListener("click", async function() {

        await supabaseClient.auth.signOut();

        window.location.href = "index.html";
      });

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function startPage() {
      const allowed = await checkAdminAccess();

      if (allowed) {
        await loadProjects();
      }
    }

    startPage();
  </script>

</body>
</html>
