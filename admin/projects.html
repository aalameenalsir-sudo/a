<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Projects — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ Add project</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Project</th><th>Published</th><th>Image</th><th>URL</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Public Project</h2><button class="btn" type="button" onclick="Admin.closeModal()">✕</button></div><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field "><label>Project title</label><input type="text" name="title" required ></div><div class="field "><label>Project URL</label><input type="url" name="project_url"  ></div><div class="field "><label>Image URL</label><input type="url" name="image_url"  ></div><div class="field full"><label>Or upload image</label><input id="imageFile" type="file" accept="image/*"></div><div class="field "><label>Published</label><select name="is_published" id="is_published"><option value="true">Published</option><option value="false">Hidden</option></select></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let all=[],editId=null;function newItem(){editId=null;form.reset();form.is_published.value='true';Admin.openModal()}function editItem(id){const r=all.find(x=>x.id===id);editId=id;for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=k==='is_published'?String(v):(v??'');Admin.openModal()}async function removeItem(id){if(!confirm('Delete public project?'))return;const {error}=await supabaseClient.from('projects').delete().eq('id',id);if(error)return Admin.toast(error.message);load()}async function uploadImage(){const f=imageFile.files[0];if(!f)return null;const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const {error}=await supabaseClient.storage.from('project-images').upload(path,f,{upsert:false});if(error)throw error;return supabaseClient.storage.from('project-images').getPublicUrl(path).data.publicUrl}function render(){rows.innerHTML=all.length?all.map(r=>`<tr><td><b>${Admin.esc(r.title)}</b><div class="sub">${Admin.esc(r.description||'')}</div></td><td>${Admin.badge(r.is_published?'published':'hidden')}</td><td>${r.image_url?`<a class="link" target="_blank" href="${Admin.esc(r.image_url)}">Image</a>`:'—'}</td><td>${Admin.safeUrl(r.project_url)?`<a class="link" target="_blank" href="${Admin.esc(Admin.safeUrl(r.project_url))}">Open</a>`:'—'}</td><td><div class="actions"><button class="btn small" onclick="editItem(${r.id})">Edit</button><button class="btn small danger" onclick="removeItem(${r.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No projects.</td></tr>'}async function load(){const {data,error}=await supabaseClient.from('projects').select('*').order('created_at',{ascending:false});if(error)return Admin.toast(error.message);all=data||[];render()}form.addEventListener('submit',async e=>{e.preventDefault();try{let o=Object.fromEntries(new FormData(form));delete o.id;o.is_published=o.is_published==='true';const uploaded=await uploadImage();if(uploaded)o.image_url=uploaded;if(o.project_url&&!Admin.safeUrl(o.project_url))return Admin.toast('Project URL must use http/https');if(o.image_url&&!Admin.safeUrl(o.image_url))return Admin.toast('Image URL must use http/https');Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=editId?await supabaseClient.from('projects').update(o).eq('id',editId):await supabaseClient.from('projects').insert(o);if(res.error)throw res.error;Admin.closeModal();Admin.toast('Saved');load()}catch(err){Admin.toast(err.message)}});(async()=>{Admin.shell('Public Projects','Projects shown dynamically on the public A Solution website.');if(await Admin.requireAdmin())load()})();
</script></body></html>
