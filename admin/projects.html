<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Solution — Projects Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #1a1a1a;
    }

    header {
      background: linear-gradient(90deg, #ff6b6b, #c44569, #574b90);
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    button,
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-btn {
      background: white;
      color: #574b90;
    }

    .logout-btn {
      background: white;
      color: #c44569;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
    }

    .panel {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    .panel h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font: inherit;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .image-box {
      border: 2px dashed #ddd;
      padding: 20px;
      border-radius: 14px;
      background: #fafafa;
    }

    .image-preview {
      margin-top: 15px;
      display: none;
    }

    .image-preview img {
      width: 100%;
      max-width: 350px;
      height: 210px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #eee;
    }

    .image-note {
      font-size: 13px;
      color: #777;
      margin-top: 8px;
    }

    .save-btn {
      background: #574b90;
      color: white;
    }

    .cancel-btn {
      background: #eee;
      color: #333;
      display: none;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      min-height: 18px;
    }

    .error {
      color: #c0392b;
    }

    .success {
      color: #1e8449;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .project-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }

    .project-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #eee;
    }

    .no-image {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eee;
      color: #777;
      font-weight: bold;
    }

    .project-content {
      padding: 18px;
    }

    .project-content h3 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .project-content p {
      color: #666;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .project-link {
      color: #574b90;
      font-weight: bold;
      text-decoration: none;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .published {
      background: #d5f5e3;
      color: #1e8449;
    }

    .hidden {
      background: #f2f3f4;
      color: #666;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .edit-btn {
      background: #f4d03f;
      color: #222;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .toggle-btn {
      background: #3498db;
      color: white;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
      grid-column: 1 / -1;
    }

    @media (max-width: 700px) {
      main {
        padding: 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Projects Management</h1>

  <div class="header-actions">
    <a href="dashboard.html" class="btn back-btn">Dashboard</a>
    <button class="logout-btn" id="logoutBtn" type="button">
      Logout
    </button>
  </div>
</header>

<main>

  <div class="panel">
    <h2 id="formTitle">Add New Project</h2>

    <form id="projectForm">

      <div class="form-grid">

        <div>
          <label for="title">Project Title</label>
          <input
            type="text"
            id="title"
            required
            placeholder="Enter project title"
          >
        </div>

        <div>
          <label for="projectUrl">Project URL</label>
          <input
            type="url"
            id="projectUrl"
            placeholder="https://example.com"
          >
        </div>

        <div class="full">
          <label for="description">Description</label>
          <textarea
            id="description"
            placeholder="Write project description"
          ></textarea>
        </div>

        <div class="full">
          <label for="projectImage">Project Image</label>

          <div class="image-box">
            <input
              type="file"
              id="projectImage"
              accept="image/*"
            >

            <div class="image-note">
              Choose an image from your computer.
            </div>

            <div class="image-preview" id="imagePreview">
              <img id="previewImage" alt="Project image preview">
            </div>
          </div>
        </div>

        <div>
          <label for="published">Status</label>

          <select id="published">
            <option value="true">Published</option>
            <option value="false">Hidden</option>
          </select>
        </div>

      </div>

      <div style="margin-top:20px;">
        <button
          type="submit"
          class="save-btn"
          id="saveBtn"
        >
          Add Project
        </button>

        <button
          type="button"
          class="cancel-btn"
          id="cancelBtn"
        >
          Cancel Edit
        </button>
      </div>

      <div class="status" id="status"></div>

    </form>
  </div>

  <div class="panel">
    <h2>Projects</h2>

    <div class="projects-grid" id="projectsGrid">
      <div class="empty">Loading projects...</div>
    </div>
  </div>

</main>

<script>
  const projectForm = document.getElementById("projectForm");
  const titleInput = document.getElementById("title");
  const descriptionInput = document.getElementById("description");
  const projectUrlInput = document.getElementById("projectUrl");
  const projectImageInput = document.getElementById("projectImage");
  const publishedInput = document.getElementById("published");

  const imagePreview = document.getElementById("imagePreview");
  const previewImage = document.getElementById("previewImage");

  const projectsGrid = document.getElementById("projectsGrid");
  const status = document.getElementById("status");
  const saveBtn = document.getElementById("saveBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const formTitle = document.getElementById("formTitle");
  const logoutBtn = document.getElementById("logoutBtn");

  let editingProjectId = null;
  let editingOldImageUrl = null;
  let projectsCache = [];

  async function checkAdminAccess() {
    try {
      const {
        data: { session },
        error: sessionError
      } = await supabaseClient.auth.getSession();

      if (sessionError) {
        throw sessionError;
      }

      if (!session) {
        window.location.href = "index.html";
        return false;
      }

      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", session.user.id)
        .single();

      if (profileError) {
        throw profileError;
      }

      if (!profile || profile.role !== "admin") {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
        return false;
      }

      return true;

    } catch (error) {
      console.error("Admin access error:", error);

      alert(
        "Unable to verify admin access: " +
        error.message
      );

      return false;
    }
  }

  projectImageInput.addEventListener("change", function() {
    const file = projectImageInput.files[0];

    if (!file) {
      return;
    }

    if (!file.type.startsWith("image/")) {
      alert("Please choose an image file.");
      projectImageInput.value = "";
      return;
    }

    previewImage.src = URL.createObjectURL(file);
    imagePreview.style.display = "block";
  });

  async function uploadProjectImage(file) {
    if (!file) {
      return null;
    }

    const extension =
      file.name.includes(".")
        ? file.name.split(".").pop().toLowerCase()
        : "jpg";

    const uniqueName =
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2, 12) +
      "." +
      extension;

    const filePath = "projects/" + uniqueName;

    const {
      error: uploadError
    } = await supabaseClient.storage
      .from("project-images")
      .upload(filePath, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type
      });

    if (uploadError) {
      throw uploadError;
    }

    const {
      data: publicUrlData
    } = supabaseClient.storage
      .from("project-images")
      .getPublicUrl(filePath);

    return publicUrlData.publicUrl;
  }

  function getStoragePathFromUrl(imageUrl) {
    if (!imageUrl) {
      return null;
    }

    const marker =
      "/storage/v1/object/public/project-images/";

    const position = imageUrl.indexOf(marker);

    if (position === -1) {
      return null;
    }

    return decodeURIComponent(
      imageUrl.substring(position + marker.length)
    );
  }

  async function deleteImageFromStorage(imageUrl) {
    const filePath = getStoragePathFromUrl(imageUrl);

    if (!filePath) {
      return;
    }

    const {
      error
    } = await supabaseClient.storage
      .from("project-images")
      .remove([filePath]);

    if (error) {
      console.error(
        "Image delete error:",
        error
      );
    }
  }

  async function loadProjects() {
    projectsGrid.innerHTML =
      '<div class="empty">Loading projects...</div>';

    const {
      data,
      error
    } = await supabaseClient
      .from("projects")
      .select("*")
      .order("created_at", {
        ascending: false
      });

    if (error) {
      console.error("Load projects error:", error);

      projectsGrid.innerHTML =
        '<div class="empty">Error loading projects: ' +
        escapeHtml(error.message) +
        "</div>";

      return;
    }

    projectsCache = data || [];

    if (projectsCache.length === 0) {
      projectsGrid.innerHTML =
        '<div class="empty">No projects added yet.</div>';

      return;
    }

    projectsGrid.innerHTML = "";

    projectsCache.forEach(project => {
      const card = document.createElement("div");
      card.className = "project-card";

      if (project.image_url) {
        const image = document.createElement("img");

        image.src = project.image_url;
        image.alt = project.title || "Project";

        image.onerror = function() {
          image.style.display = "none";
        };

        card.appendChild(image);

      } else {
        const noImage = document.createElement("div");

        noImage.className = "no-image";
        noImage.textContent = "No Image";

        card.appendChild(noImage);
      }

      const content = document.createElement("div");
      content.className = "project-content";

      const badge = document.createElement("span");

      badge.className =
        "badge " +
        (project.is_published
          ? "published"
          : "hidden");

      badge.textContent =
        project.is_published
          ? "Published"
          : "Hidden";

      const title = document.createElement("h3");
      title.textContent = project.title || "";

      const description = document.createElement("p");
      description.textContent =
        project.description || "";

      content.appendChild(badge);
      content.appendChild(title);

      if (project.description) {
        content.appendChild(description);
      }

      if (project.project_url) {
        const linkWrapper =
          document.createElement("p");

        const projectLink =
          document.createElement("a");

        projectLink.href =
          project.project_url;

        projectLink.target = "_blank";
        projectLink.rel = "noopener noreferrer";
        projectLink.className = "project-link";
        projectLink.textContent = "View Project";

        linkWrapper.appendChild(projectLink);
        content.appendChild(linkWrapper);
      }

      const actions =
        document.createElement("div");

      actions.className = "card-actions";

      const editButton =
        document.createElement("button");

      editButton.type = "button";
      editButton.className = "edit-btn";
      editButton.textContent = "Edit";

      editButton.addEventListener(
        "click",
        function() {
          editProject(project.id);
        }
      );

      const toggleButton =
        document.createElement("button");

      toggleButton.type = "button";
      toggleButton.className = "toggle-btn";

      toggleButton.textContent =
        project.is_published
          ? "Hide"
          : "Publish";

      toggleButton.addEventListener(
        "click",
        function() {
          toggleProject(
            project.id,
            project.is_published
          );
        }
      );

      const deleteButton =
        document.createElement("button");

      deleteButton.type = "button";
      deleteButton.className = "delete-btn";
      deleteButton.textContent = "Delete";

      deleteButton.addEventListener(
        "click",
        function() {
          deleteProject(project.id);
        }
      );

      actions.appendChild(editButton);
      actions.appendChild(toggleButton);
      actions.appendChild(deleteButton);

      content.appendChild(actions);
      card.appendChild(content);

      projectsGrid.appendChild(card);
    });
  }

  projectForm.addEventListener(
    "submit",
    async function(event) {
      event.preventDefault();

      const title =
        titleInput.value.trim();

      if (!title) {
        status.textContent =
          "Please enter a project title.";

        status.className =
          "status error";

        return;
      }

      status.textContent =
        projectImageInput.files[0]
          ? "Uploading image and saving project..."
          : "Saving project...";

      status.className = "status";
      saveBtn.disabled = true;

      try {
        const selectedFile =
          projectImageInput.files[0];

        let finalImageUrl =
          editingOldImageUrl || "";

        let newImageUrl = null;

        if (selectedFile) {
          newImageUrl =
            await uploadProjectImage(
              selectedFile
            );

          finalImageUrl = newImageUrl;
        }

        const projectData = {
          title: title,
          description:
            descriptionInput.value.trim(),
          image_url:
            finalImageUrl || null,
          project_url:
            projectUrlInput.value.trim() || null,
          is_published:
            publishedInput.value === "true"
        };

        let databaseError = null;

        if (editingProjectId !== null) {
          const {
            error
          } = await supabaseClient
            .from("projects")
            .update(projectData)
            .eq("id", editingProjectId);

          databaseError = error;

        } else {
          const {
            error
          } = await supabaseClient
            .from("projects")
            .insert(projectData);

          databaseError = error;
        }

        if (databaseError) {
          if (newImageUrl) {
            await deleteImageFromStorage(
              newImageUrl
            );
          }

          throw databaseError;
        }

        if (
          editingProjectId !== null &&
          newImageUrl &&
          editingOldImageUrl &&
          newImageUrl !== editingOldImageUrl
        ) {
          await deleteImageFromStorage(
            editingOldImageUrl
          );
        }

        status.textContent =
          editingProjectId !== null
            ? "Project updated successfully."
            : "Project added successfully.";

        status.className =
          "status success";

        resetForm();

        await loadProjects();

      } catch (error) {
        console.error(
          "Save project error:",
          error
        );

        status.textContent =
          "Error: " + error.message;

        status.className =
          "status error";

      } finally {
        saveBtn.disabled = false;
      }
    }
  );

  function editProject(projectId) {
    const project =
      projectsCache.find(
        item => item.id === projectId
      );

    if (!project) {
      return;
    }

    editingProjectId = project.id;
    editingOldImageUrl =
      project.image_url || null;

    titleInput.value =
      project.title || "";

    descriptionInput.value =
      project.description || "";

    projectUrlInput.value =
      project.project_url || "";

    publishedInput.value =
      project.is_published
        ? "true"
        : "false";

    projectImageInput.value = "";

    if (project.image_url) {
      previewImage.src =
        project.image_url;

      imagePreview.style.display =
        "block";

    } else {
      previewImage.removeAttribute("src");
      imagePreview.style.display =
        "none";
    }

    formTitle.textContent =
      "Edit Project";

    saveBtn.textContent =
      "Save Changes";

    cancelBtn.style.display =
      "inline-block";

    status.textContent =
      "You can choose a new image, or leave it unchanged.";

    status.className = "status";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  async function toggleProject(
    id,
    currentStatus
  ) {
    const {
      error
    } = await supabaseClient
      .from("projects")
      .update({
        is_published: !currentStatus
      })
      .eq("id", id);

    if (error) {
      alert(
        "Error: " + error.message
      );

      return;
    }

    await loadProjects();
  }

  async function deleteProject(id) {
    const project =
      projectsCache.find(
        item => item.id === id
      );

    if (!project) {
      return;
    }

    const confirmed = confirm(
      "Are you sure you want to delete this project?"
    );

    if (!confirmed) {
      return;
    }

    const {
      error
    } = await supabaseClient
      .from("projects")
      .delete()
      .eq("id", id);

    if (error) {
      alert(
        "Error: " + error.message
      );

      return;
    }

    if (project.image_url) {
      await deleteImageFromStorage(
        project.image_url
      );
    }

    if (editingProjectId === id) {
      resetForm();
    }

    await loadProjects();
  }

  function resetForm() {
    projectForm.reset();

    editingProjectId = null;
    editingOldImageUrl = null;

    previewImage.removeAttribute("src");
    imagePreview.style.display = "none";

    formTitle.textContent =
      "Add New Project";

    saveBtn.textContent =
      "Add Project";

    cancelBtn.style.display =
      "none";
  }

  cancelBtn.addEventListener(
    "click",
    function() {
      resetForm();

      status.textContent = "";
      status.className = "status";
    }
  );

  logoutBtn.addEventListener(
    "click",
    async function() {
      logoutBtn.disabled = true;
      logoutBtn.textContent =
        "Logging out...";

      await supabaseClient.auth.signOut();

      window.location.href =
        "index.html";
    }
  );

  function escapeHtml(text) {
    const div =
      document.createElement("div");

    div.textContent =
      String(text || "");

    return div.innerHTML;
  }

  async function startPage() {
    const allowed =
      await checkAdminAccess();

    if (allowed) {
      await loadProjects();
    }
  }

  startPage();
</script>

</body>
</html>
