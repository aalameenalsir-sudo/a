<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Commerce — Order</title><link rel="stylesheet" href="../store/store.css"><style>.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}.detail-card{border:1px solid var(--line);padding:20px;margin-bottom:16px}.detail-card h3{margin-top:0}.line{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid var(--line)}@media(max-width:800px){.detail-grid{grid-template-columns:1fr}}</style></head><body><div class="admin-shell"><aside class="admin-nav"><h2>A SOLUTION</h2><small>COMMERCE</small><a href="store-dashboard.html">Dashboard</a><a href="store-orders.html">Orders</a><a href="store-products.html">Products</a><a href="store-customers.html">Customers / CRM</a><a href="store-payments.html">Payments</a><a href="store-settings.html">Settings</a></aside><main class="admin-main"><p class="section-no">COMMERCE / ORDER</p><h1 id="order-title">ORDER</h1><p id="detail-status"></p><div class="detail-grid"><section><div class="detail-card"><h3>Items</h3><div id="order-items"></div></div><div class="detail-card"><h3>Customer & Delivery</h3><div id="customer"></div></div><div class="detail-card" id="service-card" hidden><h3>Service Job</h3><div id="service-jobs"></div></div><div class="detail-card" id="digital-card" hidden><h3>Digital Delivery</h3><div id="digital-entitlements"></div></div><div class="detail-card" id="shipment-card" hidden><h3>Shipment</h3><form id="shipment-form" class="form-grid"><label class="field"><span>Provider</span><input name="provider"></label><label class="field"><span>Tracking number</span><input name="tracking_number"></label><label class="field full"><span>Tracking URL</span><input name="tracking_url"></label><label class="field"><span>Status</span><select name="status"><option>pending</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></label><button class="primary" type="submit">SAVE SHIPMENT</button></form></div></section><aside><div class="detail-card"><h3>Totals</h3><div id="totals"></div></div><div class="detail-card"><h3>Statuses</h3><form id="status-form"><label class="field"><span>Order</span><select name="order_status"><option>open</option><option>confirmed</option><option>completed</option><option>cancelled</option></select></label><label class="field"><span>Fulfillment</span><select name="fulfillment_status"><option>unfulfilled</option><option>processing</option><option>fulfilled</option><option>cancelled</option><option>returned</option></select></label><button class="primary" type="submit">SAVE STATUS</button></form></div><div class="detail-card" id="finance-card"><h3>Finance</h3><div id="payment-info"></div><form id="refund-form"><label class="field"><span>Refund amount</span><input name="amount" type="number" min="0.01" step="0.01"></label><label class="field"><span>Reason</span><textarea name="reason"></textarea></label><button class="primary" type="submit">CREATE REFUND</button></form></div></aside></div></main></div><script src="store-admin.js"></script><script src="store-order-detail.js"></script></body></html>
