<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="filters"><select id="statusFilter"><option value="">All statuses</option><option>new</option><option>read</option><option>replied</option><option>closed</option></select></div><section class="section"><div id="list" class="list"></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let all=[];function render(){let x=statusFilter.value?all.filter(m=>m.status===statusFilter.value):all;list.innerHTML=x.length?x.map(m=>`<div class="list-item"><div class="row"><div><b>${Admin.esc(m.subject||'Website message')}</b><div class="sub">${Admin.esc(m.name)} · ${Admin.esc(m.company||'')} · ${Admin.datetime(m.created_at)} · ${Admin.badge(m.status)}</div></div><div class="actions"><select onchange="setStatus(${m.id},this.value)"><option ${m.status==='new'?'selected':''}>new</option><option ${m.status==='read'?'selected':''}>read</option><option ${m.status==='replied'?'selected':''}>replied</option><option ${m.status==='closed'?'selected':''}>closed</option></select><button class="btn small danger" onclick="removeItem(${m.id})">Delete</button></div></div><p>${Admin.esc(m.message||'')}</p><div class="sub">${Admin.esc(m.email||'')} ${m.phone?'· '+Admin.esc(m.phone):''}</div></div>`).join(''):'<div class="empty">No messages.</div>'}async function load(){const {data,error}=await supabaseClient.from('messages').select('*').order('created_at',{ascending:false});if(error)return Admin.toast(error.message);all=data||[];render()}async function setStatus(id,status){const {error}=await supabaseClient.from('messages').update({status}).eq('id',id);if(error)return Admin.toast(error.message);load()}async function removeItem(id){if(!confirm('Delete message?'))return;const {error}=await supabaseClient.from('messages').delete().eq('id',id);if(error)return Admin.toast(error.message);load()}statusFilter.addEventListener('change',render);(async()=>{Admin.shell('Messages','Website enquiries and response status.');if(await Admin.requireAdmin())load()})();
</script></body></html>
