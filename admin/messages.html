<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Messages | A Solution Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header a {
      color: white;
      text-decoration: none;
      background: #374151;
      padding: 10px 16px;
      border-radius: 8px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .stat strong {
      display: block;
      font-size: 26px;
      margin-bottom: 5px;
    }

    .stat span {
      color: #6b7280;
      font-size: 13px;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .panel-header h2 {
      margin: 0;
    }

    .refresh {
      border: none;
      background: #111827;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .message-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .message-card:last-child {
      margin-bottom: 0;
    }

    .message-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 15px;
    }

    .message-top h3 {
      margin: 0 0 5px;
    }

    .company {
      color: #6b7280;
      font-size: 14px;
    }

    .date {
      color: #6b7280;
      font-size: 13px;
      white-space: nowrap;
    }

    .subject {
      font-weight: bold;
      margin: 12px 0 6px;
    }

    .message-text {
      line-height: 1.7;
      background: #f9fafb;
      border-radius: 8px;
      padding: 15px;
      white-space: pre-wrap;
    }

    .contact-info {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 15px;
      font-size: 14px;
    }

    .contact-info a {
      color: #2563eb;
      text-decoration: none;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select {
      padding: 9px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
    }

    button {
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .save {
      background: #111827;
      color: white;
    }

    .delete {
      background: #dc2626;
      color: white;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #eef2ff;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 40px;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .message-top {
        flex-direction: column;
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>A Solution — Messages</h1>
  <a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

  <div class="stats">

    <div class="stat">
      <strong id="totalCount">0</strong>
      <span>Total Messages</span>
    </div>

    <div class="stat">
      <strong id="newCount">0</strong>
      <span>New</span>
    </div>

    <div class="stat">
      <strong id="repliedCount">0</strong>
      <span>Replied</span>
    </div>

    <div class="stat">
      <strong id="closedCount">0</strong>
      <span>Closed</span>
    </div>

  </div>

  <div class="panel">

    <div class="panel-header">
      <h2>Website Messages</h2>

      <button
        class="refresh"
        type="button"
        id="refreshButton"
      >
        Refresh
      </button>
    </div>

    <div id="messagesContainer">
      <div class="empty">
        Loading messages...
      </div>
    </div>

  </div>

</div>

<script>
  let messagesCache = [];


  async function checkAdmin() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if (!session) {
      window.location.href = "index.html";
      return false;
    }


    const {
      data: profile,
      error
    } = await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", session.user.id)
      .single();


    if (
      error ||
      !profile ||
      profile.role !== "admin"
    ) {

      alert("You do not have admin permission.");

      window.location.href = "index.html";

      return false;
    }


    return true;
  }


  async function loadMessages() {

    const container =
      document.getElementById("messagesContainer");


    container.innerHTML =
      '<div class="empty">Loading messages...</div>';


    const {
      data,
      error
    } = await supabaseClient
      .from("messages")
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      container.innerHTML =
        '<div class="empty">Could not load messages.</div>';

      return;
    }


    messagesCache = data || [];

    renderMessages();
    updateStats();
  }


  function updateStats() {

    document.getElementById("totalCount").textContent =
      messagesCache.length;


    document.getElementById("newCount").textContent =
      messagesCache.filter(
        item => item.status === "new"
      ).length;


    document.getElementById("repliedCount").textContent =
      messagesCache.filter(
        item => item.status === "replied"
      ).length;


    document.getElementById("closedCount").textContent =
      messagesCache.filter(
        item => item.status === "closed"
      ).length;
  }


  function renderMessages() {

    const container =
      document.getElementById("messagesContainer");


    container.innerHTML = "";


    if (messagesCache.length === 0) {

      container.innerHTML =
        '<div class="empty">No messages yet.</div>';

      return;
    }


    messagesCache.forEach(message => {

      const card =
        document.createElement("div");

      card.className = "message-card";


      const top =
        document.createElement("div");

      top.className = "message-top";


      const person =
        document.createElement("div");


      const name =
        document.createElement("h3");

      name.textContent =
        message.name || "Website Visitor";


      const company =
        document.createElement("div");

      company.className = "company";

      company.textContent =
        message.company || "No company";


      person.appendChild(name);
      person.appendChild(company);


      const date =
        document.createElement("div");

      date.className = "date";

      date.textContent =
        formatDate(message.created_at);


      top.appendChild(person);
      top.appendChild(date);

      card.appendChild(top);


      const badge =
        document.createElement("span");

      badge.className = "badge";

      badge.textContent =
        formatStatus(message.status);

      card.appendChild(badge);


      if (message.subject) {

        const subject =
          document.createElement("div");

        subject.className = "subject";

        subject.textContent =
          message.subject;

        card.appendChild(subject);
      }


      const text =
        document.createElement("div");

      text.className = "message-text";

      text.textContent =
        message.message || "";

      card.appendChild(text);


      const contact =
        document.createElement("div");

      contact.className = "contact-info";


      if (message.email) {

        const email =
          document.createElement("a");

        email.href =
          "mailto:" + message.email;

        email.textContent =
          message.email;

        contact.appendChild(email);
      }


      if (message.phone) {

        const phone =
          document.createElement("span");

        phone.textContent =
          message.phone;

        contact.appendChild(phone);
      }


      card.appendChild(contact);


      const actions =
        document.createElement("div");

      actions.className = "actions";


      const select =
        document.createElement("select");


      const statuses = [
        ["new", "New"],
        ["read", "Read"],
        ["replied", "Replied"],
        ["closed", "Closed"]
      ];


      statuses.forEach(item => {

        const option =
          document.createElement("option");

        option.value = item[0];
        option.textContent = item[1];

        if (message.status === item[0]) {
          option.selected = true;
        }

        select.appendChild(option);
      });


      const saveButton =
        document.createElement("button");

      saveButton.className = "save";
      saveButton.textContent = "Save Status";

      saveButton.addEventListener(
        "click",
        () => updateStatus(
          message.id,
          select.value
        )
      );


      const deleteButton =
        document.createElement("button");

      deleteButton.className = "delete";
      deleteButton.textContent = "Delete";

      deleteButton.addEventListener(
        "click",
        () => deleteMessage(message.id)
      );


      actions.appendChild(select);
      actions.appendChild(saveButton);
      actions.appendChild(deleteButton);

      card.appendChild(actions);

      container.appendChild(card);
    });
  }


  function formatStatus(status) {

    const values = {
      new: "New",
      read: "Read",
      replied: "Replied",
      closed: "Closed"
    };

    return values[status] || "New";
  }


  function formatDate(value) {

    if (!value) {
      return "";
    }

    return new Date(value).toLocaleString();
  }


  async function updateStatus(
    id,
    status
  ) {

    const {
      error
    } = await supabaseClient
      .from("messages")
      .update({
        status: status
      })
      .eq("id", id);


    if (error) {

      alert(
        "Could not update message: " +
        error.message
      );

      return;
    }


    await loadMessages();
  }


  async function deleteMessage(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this message?"
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } = await supabaseClient
      .from("messages")
      .delete()
      .eq("id", id);


    if (error) {

      alert(
        "Could not delete message: " +
        error.message
      );

      return;
    }


    await loadMessages();
  }


  document
    .getElementById("refreshButton")
    .addEventListener(
      "click",
      loadMessages
    );


  async function startPage() {

    const isAdmin =
      await checkAdmin();


    if (!isAdmin) {
      return;
    }


    await loadMessages();
  }


  startPage();
</script>

</body>
</html>
