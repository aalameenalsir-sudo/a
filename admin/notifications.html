<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn" onclick="markAll()">Mark all read</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="filters"><select id="filter"><option value="all">All notifications</option><option value="unread">Unread only</option></select></div><section class="section"><div id="list" class="list"></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let all=[];function render(){let x=filter.value==='unread'?all.filter(n=>!n.read_at):all;list.innerHTML=x.length?x.map(n=>`<div class="list-item"><div class="row"><div><b>${Admin.esc(n.title)}</b><div class="sub">${Admin.datetime(n.created_at)} · ${Admin.badge(n.type)}</div><p>${Admin.esc(n.body||'')}</p></div>${n.read_at?'':`<button class="btn small" onclick="markRead(${n.id})">Mark read</button>`}</div></div>`).join(''):'<div class="empty">No notifications.</div>'}async function markRead(id){const {error}=await supabaseClient.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id);if(error)return Admin.toast(error.message);load()}async function markAll(){const ids=all.filter(x=>!x.read_at).map(x=>x.id);if(!ids.length)return;const {error}=await supabaseClient.from('notifications').update({read_at:new Date().toISOString()}).in('id',ids);if(error)return Admin.toast(error.message);load()}async function load(){const {data,error}=await supabaseClient.from('notifications').select('*').order('created_at',{ascending:false});if(error)return Admin.toast(error.message);all=data||[];render()}filter.addEventListener('change',render);(async()=>{Admin.shell('Notifications','Unread alerts and system updates.');if(await Admin.requireAdmin())load()})();
</script></body></html>
