<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div><button class="btn" onclick="Admin.logout()">Logout</button></div><div id="list"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
async function load(){let {data,error}=await supabaseClient.from('notifications').select('*').order('created_at',{ascending:false});if(error)return Admin.toast(error.message);list.innerHTML=(data||[]).map(n=>`<div class="card section"><b>${Admin.esc(n.title)}</b><p>${Admin.esc(n.body||'')}</p><span class="badge">${n.read_at?'Read':'Unread'}</span> ${!n.read_at?`<button class="btn small" onclick="read(${n.id})">Mark read</button>`:''}</div>`).join('')||'<div class="card empty">No notifications.</div>'}async function read(id){await supabaseClient.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id);load()}(async()=>{Admin.shell('Notifications','Updates that need your attention');if(await Admin.requireAdmin())load()})();</script></body></html>
