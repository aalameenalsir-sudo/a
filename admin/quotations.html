<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotations — A Solution</title><link rel="stylesheet" href="admin-common.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="topbar"><div class="toolbar"><button class="btn mobile-menu" onclick="Admin.toggleMenu()">☰</button><div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div></div><div class="actions"><button class="btn primary" onclick="newItem()">+ New quotation</button><button class="btn" onclick="Admin.logout()">Logout</button></div></div><div class="filters"><select id="clientFilter"><option value="">All clients</option></select><select id="statusFilter"><option value="">All statuses</option><option>draft</option><option>sent</option><option>approved</option><option>rejected</option><option>expired</option></select></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Number</th><th>Client</th><th>Title</th><th>Status</th><th>Total</th><th>Valid until</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Quotation</h2><button class="btn" type="button" onclick="Admin.closeModal()">✕</button></div><form id="form"><input type="hidden" name="id"><div class="form-grid"><div class="field "><label>Quotation title</label><input type="text" name="title" required ></div><div class="field "><label>Client</label><select name="client_id" id="clientSelect"></select></div><div class="field "><label>Status</label><select name="status" id="status"><option value="draft">Draft</option><option value="sent">Sent</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="expired">Expired</option></select></div><div class="field "><label>Valid until</label><input type="date" name="valid_until"  ></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="form-actions"><button class="btn" type="button" onclick="Admin.closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="admin-common.js"></script><script>
let all=[],clientMap={},editId=null;async function init(){const c=await Admin.loadSelect('#clientSelect','clients',{label:'name',placeholder:'Select client'});clientMap=Object.fromEntries(c.map(x=>[x.id,x.name]));clientFilter.innerHTML='<option value="">All clients</option>'+c.map(x=>`<option value="${x.id}">${Admin.esc(x.name)}</option>`).join('')}
function newItem(){editId=null;form.reset();Admin.openModal()}function editItem(id){const r=all.find(x=>x.id===id);editId=id;for(const [k,v] of Object.entries(r))if(form.elements[k])form.elements[k].value=v??'';Admin.openModal()}
async function removeItem(id){if(!confirm('Delete quotation and its items?'))return;const {error}=await supabaseClient.from('quotations').delete().eq('id',id);if(error)return Admin.toast(error.message);load()}
function render(){let list=[...all];if(clientFilter.value)list=list.filter(x=>String(x.client_id)===clientFilter.value);if(statusFilter.value)list=list.filter(x=>x.status===statusFilter.value);rows.innerHTML=list.length?list.map(r=>`<tr><td><b>${Admin.esc(r.quote_number)}</b></td><td>${Admin.esc(clientMap[r.client_id]||'—')}</td><td>${Admin.esc(r.title)}</td><td>${Admin.badge(r.status)}</td><td>${Admin.money(r.total)}</td><td>${Admin.date(r.valid_until)}</td><td><div class="actions"><a class="btn small primary" href="quotation-edit.html?id=${r.id}">Open</a><button class="btn small" onclick="editItem(${r.id})">Edit</button><button class="btn small danger" onclick="removeItem(${r.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No quotations yet.</td></tr>'}
async function load(){const {data,error}=await supabaseClient.from('quotations').select('*').order('created_at',{ascending:false});if(error)return Admin.toast(error.message);all=data||[];render()}
form.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));delete o.id;o.client_id=Admin.id(o.client_id);if(!editId)o.quote_number=Admin.generateNumber('Q');Object.keys(o).forEach(k=>o[k]===''&&(o[k]=null));const res=editId?await supabaseClient.from('quotations').update(o).eq('id',editId).select().single():await supabaseClient.from('quotations').insert(o).select().single();if(res.error)return Admin.toast(res.error.message);Admin.closeModal();if(!editId&&res.data?.id)location.href=`quotation-edit.html?id=${res.data.id}`;else load()});clientFilter.addEventListener('change',render);statusFilter.addEventListener('change',render);(async()=>{Admin.shell('Quotations','Itemized offers with automatic 15% VAT totals.');if(await Admin.requireAdmin()){await init();await load()}})();
</script></body></html>
